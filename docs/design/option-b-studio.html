<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roomie Room · Option B · Studio split-view</title>
<style>/* ---------- shared tokens + components (inlined into every option) ---------- */
*, *::before, *::after { box-sizing: border-box; }
:root {
  --bg: #f2ddd0; --bg-2: #ebd0c0; --paper: #fffaf6; --paper-2: #fbf2ea; --paper-3: #f6e8dd;
  --ink: #3a2e28; --ink-2: #5b4a40; --muted: #8c786c; --line: rgba(58, 46, 40, .1); --line-2: rgba(58, 46, 40, .18);
  --accent: #d6784d; --accent-2: #c4673e; --accent-soft: #f7dccb; --sage: #6fa38c; --lilac: #8f8fcf; --good: #4f9a76; --warn: #c9853a;
  --shadow: 0 24px 60px -28px rgba(120, 66, 36, .45), 0 2px 8px rgba(120, 66, 36, .08);
  --shadow-sm: 0 8px 22px -12px rgba(120, 66, 36, .45);
  --r: 20px; --r-sm: 12px;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4, p { margin: 0; }
.rr-hidden { display: none !important; }
.rr-muted { color: var(--muted); }
.rr-small { font-size: 12px; }

.rr-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; padding: 11px 18px; background: var(--accent); color: #fff; font-weight: 650; font-size: 14px; letter-spacing: .01em; box-shadow: 0 10px 22px -12px rgba(196, 103, 62, .9); transition: transform .18s ease, background .18s ease, box-shadow .18s ease, opacity .18s; white-space: nowrap; }
.rr-btn:hover { background: var(--accent-2); transform: translateY(-1px); }
.rr-btn:active { transform: translateY(0) scale(.98); }
.rr-btn:disabled { opacity: .45; pointer-events: none; }
.rr-btn.ghost { background: transparent; color: var(--ink-2); box-shadow: none; border: 1px solid var(--line-2); }
.rr-btn.ghost:hover { background: rgba(255, 255, 255, .6); }
.rr-btn.soft { background: var(--accent-soft); color: var(--accent-2); box-shadow: none; }
.rr-btn.dark { background: var(--ink); box-shadow: 0 10px 22px -12px rgba(30, 20, 10, .8); }
.rr-btn.sm { padding: 7px 12px; font-size: 13px; }
.rr-btn.block { width: 100%; }
.rr-btn svg { flex: none; }

.rr-pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 650; background: var(--paper-3); color: var(--ink-2); white-space: nowrap; }
.rr-pill.ai { background: #efe9fb; color: #5d4fa8; }
.rr-pill.good { background: #e2f1e8; color: #2f7553; }
.rr-pill.warn { background: #fbecd9; color: #9a5d1d; }

.rr-av { --s: 28px; --c: #ccc; display: inline-grid; place-items: center; width: var(--s); height: var(--s); border-radius: 50%; background: var(--c); color: #fff; font-weight: 750; font-size: calc(var(--s) * .44); box-shadow: 0 0 0 2px var(--paper); flex: none; }
.rr-avs { display: inline-flex; }
.rr-avs .rr-av + .rr-av { margin-left: -7px; }

.rr-field { display: grid; gap: 6px; font-size: 12px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.rr-field > span:first-child { padding-left: 2px; }
.rr-input { width: 100%; min-width: 0; border: 1px solid var(--line-2); background: #fff; border-radius: var(--r-sm); padding: 10px 12px; font-size: 15px; font-weight: 550; color: var(--ink); text-transform: none; letter-spacing: 0; outline: none; transition: border-color .15s, box-shadow .15s; }
.rr-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(214, 120, 77, .15); }
.rr-money { position: relative; }
.rr-money > b { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; font-size: 15px; }
.rr-money > .rr-input { padding-left: 24px; }
.rr-grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.rr-stack { display: grid; gap: 14px; }

.rr-seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--paper-3); gap: 2px; text-transform: none; letter-spacing: 0; }
.rr-seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 650; color: var(--muted); }
.rr-seg button.on { background: #fff; color: var(--ink); box-shadow: var(--shadow-sm); }

.rr-splits { display: grid; gap: 6px; text-transform: none; letter-spacing: 0; }
.rr-split-row { display: grid; grid-template-columns: auto minmax(0, 1fr) 110px 44px; align-items: center; gap: 10px; padding: 6px 8px 6px 6px; border-radius: 14px; background: #fff; border: 1px solid var(--line); transition: opacity .2s; }
.rr-split-row.off { opacity: .45; }
.rr-split-row .who { font-size: 14px; font-weight: 650; color: var(--ink); display: flex; align-items: center; gap: 8px; min-width: 0; }
.rr-split-row .who input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.rr-split-row .pct { font-size: 12px; color: var(--muted); text-align: right; font-weight: 600; }
.rr-split-row .rr-input { padding: 6px 8px 6px 20px; font-size: 14px; }
.rr-split-row .rr-money > b { left: 8px; font-size: 13px; }
.rr-split-sum { font-size: 12px; font-weight: 650; text-transform: none; letter-spacing: 0; }
.rr-split-sum.ok { color: var(--good); }
.rr-split-sum.bad { color: var(--warn); }

.rr-cats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.rr-cat { position: relative; display: grid; justify-items: center; gap: 6px; padding: 12px 6px 10px; border-radius: 16px; border: 1.5px solid var(--line-2); background: #fff; font-size: 12px; font-weight: 700; color: var(--ink-2); transition: all .18s; }
.rr-cat:hover { border-color: var(--accent); }
.rr-cat.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-2); box-shadow: 0 0 0 3px rgba(214, 120, 77, .12); }
.rr-cat .p { position: absolute; top: 5px; right: 6px; font-size: 10px; font-weight: 700; color: var(--muted); }
.rr-cat.on .p { color: var(--accent-2); }

.rr-drop { display: grid; place-items: center; gap: 8px; text-align: center; border: 2px dashed var(--line-2); border-radius: var(--r); padding: 26px 16px; background: rgba(255, 255, 255, .55); cursor: pointer; transition: all .18s; }
.rr-drop:hover, .rr-drop.over { border-color: var(--accent); background: #fff; }
.rr-drop .ic { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-2); }
.rr-drop b { font-size: 15px; }
.rr-drop input { display: none; }
.rr-samples { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.rr-sample { border: 1.5px solid transparent; border-radius: 12px; padding: 0; overflow: hidden; background: #fff; aspect-ratio: 4 / 3; box-shadow: var(--shadow-sm); transition: all .18s; position: relative; }
.rr-sample:hover { border-color: var(--accent); transform: translateY(-2px); }
.rr-sample img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rr-sample span { position: absolute; left: 4px; bottom: 4px; font-size: 10px; font-weight: 700; background: rgba(255, 255, 255, .85); border-radius: 6px; padding: 1px 5px; }

.rr-scan { position: relative; overflow: hidden; border-radius: 14px; }
.rr-scan img { display: block; width: 100%; height: 100%; object-fit: cover; }
.rr-scan.on::after { content: ""; position: absolute; left: 0; right: 0; height: 40%; top: -40%; background: linear-gradient(180deg, transparent, rgba(255, 210, 180, .55), transparent); animation: rr-scan 1.1s ease-in-out infinite; }
@keyframes rr-scan { to { top: 100%; } }
.rr-thinking { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 650; color: #5d4fa8; }
.rr-dots { display: inline-flex; gap: 3px; }
.rr-dots i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: rr-bounce 1s infinite ease-in-out; }
.rr-dots i:nth-child(2) { animation-delay: .15s; }
.rr-dots i:nth-child(3) { animation-delay: .3s; }
@keyframes rr-bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-4px); opacity: 1; } }

/* panel content: chat + bills */
.rr-panel { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.rr-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
.rr-panel-head h3 { font-size: 18px; font-weight: 750; letter-spacing: -.01em; }
.rr-panel-head p { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.rr-panel-body { flex: 1; min-height: 0; overflow: auto; padding: 16px 20px 20px; scrollbar-width: thin; }

.rr-chatlog { display: grid; gap: 10px; align-content: start; }
.rr-msg { max-width: 88%; padding: 10px 13px; border-radius: 16px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.rr-msg.ai { background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 6px; justify-self: start; }
.rr-msg.me { background: var(--accent); color: #fff; border-bottom-right-radius: 6px; justify-self: end; }
.rr-msg.ai b { color: var(--accent-2); }
.rr-msg.ai.err { border-color: rgba(196, 82, 62, .45); background: #fff6f3; }
.rr-msg.ai.err b { color: #a5402e; }
.rr-msg .rr-chip { margin-top: 8px; }
.rr-msg-meta { font-size: 10px; color: var(--muted); font-weight: 650; margin: 2px 4px -4px; }
.rr-suggest { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 20px 0; }
.rr-chip { border: 1px solid var(--line-2); background: #fff; border-radius: 999px; padding: 6px 11px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); transition: all .15s; text-align: left; }
.rr-chip:hover { border-color: var(--accent); color: var(--accent-2); }
.rr-chatbar { display: flex; gap: 8px; padding: 12px 16px 16px; }
.rr-chatbar .rr-input { border-radius: 999px; padding: 11px 16px; }
.rr-chatbar .rr-btn { padding: 0; width: 44px; height: 44px; flex: none; }
.rr-ai-foot { font-size: 11px; color: var(--muted); padding: 0 20px 12px; }

.rr-bal { border-radius: 18px; padding: 16px; background: linear-gradient(135deg, #fff, var(--paper-2)); border: 1px solid var(--line); display: grid; gap: 10px; }
.rr-bal .big { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.rr-bal .big.pos { color: var(--good); }
.rr-bal .big.neg { color: var(--accent-2); }
.rr-xfer { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 7px 8px; border-radius: 12px; background: rgba(255, 255, 255, .7); }
.rr-xfer .arrow { color: var(--muted); }
.rr-xfer .amt { font-weight: 800; }
.rr-xfer .who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rr-xfer .rr-btn { padding: 4px 10px; font-size: 11.5px; }
.rr-sec { display: flex; align-items: center; justify-content: space-between; margin: 20px 0 8px; font-size: 12px; font-weight: 750; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.rr-bills { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rr-bill { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 14px; background: #fff; border: 1px solid var(--line); animation: rr-in .35s ease both; }
.rr-bill .ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--paper-3); color: var(--ink-2); }
.rr-bill .t { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rr-bill .s { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.rr-bill .a { font-size: 14px; font-weight: 800; text-align: right; }
.rr-bill .a small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
.rr-addbill { display: grid; gap: 10px; padding: 12px; border-radius: 16px; background: var(--paper-2); border: 1px solid var(--line); margin-bottom: 8px; animation: rr-in .3s ease both; }
.rr-who-pick { display: flex; gap: 6px; flex-wrap: wrap; }
.rr-who-pick label { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; background: #fff; border: 1px solid var(--line-2); font-size: 13px; font-weight: 650; text-transform: none; letter-spacing: 0; color: var(--ink); cursor: pointer; }
.rr-who-pick input { display: none; }
.rr-who-pick label:has(input:not(:checked)) { opacity: .45; }
.rr-stake { display: grid; gap: 8px; }
.rr-stake-row { display: grid; grid-template-columns: 70px minmax(0, 1fr) 70px; gap: 8px; align-items: center; font-size: 13px; font-weight: 650; }
.rr-stake-row .bar { height: 8px; border-radius: 99px; background: var(--paper-3); overflow: hidden; }
.rr-stake-row .bar i { display: block; height: 100%; border-radius: 99px; transition: width .5s ease; }
.rr-stake-row .v { text-align: right; }
.rr-empty-note { font-size: 13px; color: var(--muted); padding: 12px; border-radius: 14px; border: 1px dashed var(--line-2); text-align: center; }

.rr-toast-wrap { position: fixed; left: 50%; top: 78px; transform: translateX(-50%); display: grid; gap: 8px; z-index: 200; pointer-events: none; }
.rr-toast { background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 650; box-shadow: var(--shadow); animation: rr-toast .35s cubic-bezier(.2, .9, .3, 1.3) both; display: flex; gap: 8px; align-items: center; }
.rr-toast.out { animation: rr-toast-out .3s ease both; }
@keyframes rr-toast { from { opacity: 0; transform: translateY(-12px) scale(.96); } }
@keyframes rr-toast-out { to { opacity: 0; transform: translateY(-8px); } }
@keyframes rr-in { from { opacity: 0; transform: translateY(6px); } }

/* reviewer shortcuts + architecture note */
.rr-review { display: inline-flex; gap: 6px; align-items: center; padding: 4px; border-radius: 999px; border: 1px dashed rgba(58, 46, 40, .3); background: rgba(255, 255, 255, .45); backdrop-filter: blur(6px); }
.rr-review > span { font-size: 10.5px; font-weight: 750; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0 4px 0 8px; }
.rr-review button { border: 0; background: #fff; border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 650; color: var(--ink-2); box-shadow: var(--shadow-sm); }
.rr-review button:hover { color: var(--accent-2); }
.rr-arch-back { position: fixed; inset: 0; background: rgba(58, 40, 30, .28); backdrop-filter: blur(4px); display: grid; place-items: center; z-index: 300; animation: rr-fade .25s ease both; padding: 20px; }
@keyframes rr-fade { from { opacity: 0; } }
.rr-arch { width: min(820px, 100%); max-height: calc(100vh - 40px); overflow: auto; background: var(--paper); border-radius: 26px; box-shadow: var(--shadow); padding: 24px 26px; animation: rr-pop .35s cubic-bezier(.2, .9, .3, 1.2) both; }
@keyframes rr-pop { from { opacity: 0; transform: translateY(14px) scale(.97); } }
.rr-arch h2 { font-size: 20px; letter-spacing: -.01em; }
.rr-arch .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.rr-arch svg { width: 100%; height: auto; margin: 14px 0 6px; }
.rr-arch ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13.5px; line-height: 1.45; color: var(--ink-2); }
.rr-arch code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; background: var(--paper-3); padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere; }
.rr-arch .close { float: right; }
</style>
<style>
  body { background: #ead3c4; }
  .app { position: fixed; inset: 0; display: grid; grid-template-columns: 0px minmax(0, 1fr) 0px; transition: grid-template-columns .75s cubic-bezier(.22, 1, .36, 1); }
  .col { position: relative; overflow: hidden; min-width: 0; display: flex; }
  .col.left { justify-content: flex-end; }
  .col.right { justify-content: flex-start; }
  .col .panel { width: 372px; flex: none; height: 100%; background: var(--paper); }
  .col.left .panel { border-right: 1px solid var(--line); }
  .col.right .panel { border-left: 1px solid var(--line); }
  .spine { flex: none; width: 56px; height: 100%; border: 0; background: #f3e2d6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--ink-2); font-weight: 750; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; transition: background .25s, color .25s; }
  .spine:hover { background: #f7e9df; color: var(--accent-2); }
  .spine span { writing-mode: vertical-rl; }
  .col.left .spine span { transform: rotate(180deg); }
  .spine .chev { transition: transform .5s; }
  .open .spine { background: var(--paper-2); }
  .col.left.open .spine .chev { transform: rotate(180deg); }
  .col.right .spine .chev { transform: rotate(180deg); }
  .col.right.open .spine .chev { transform: rotate(0deg); }
  .spine .badge { min-width: 20px; height: 20px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 11px; letter-spacing: 0; }

  .stage { position: relative; margin: 12px; border-radius: 30px; overflow: hidden; background: radial-gradient(900px 640px at 50% 38%, #fbebe1 0%, #f3d9c9 55%, #ecccb9 100%); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .6), 0 30px 60px -40px rgba(120, 66, 36, .5); min-width: 0; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  body.hovering #scene { cursor: pointer; }
  body.dragging #scene, body.overghost #scene { cursor: grab; }
  body.dragging #scene { cursor: grabbing; }

  .stage-top { position: absolute; inset: 0 0 auto 0; display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; pointer-events: none; z-index: 10; gap: 10px; }
  .stage-top > * { pointer-events: auto; }
  .brand { display: flex; gap: 10px; align-items: center; }
  .logo { width: 34px; height: 34px; border-radius: 11px; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
  .brand b { display: block; font-size: 15px; }
  .brand small { color: var(--muted); font-size: 12px; font-weight: 650; }
  .tr { display: flex; gap: 10px; align-items: center; justify-content: flex-end; }
  .orbit-hint { position: absolute; right: 18px; bottom: 18px; z-index: 6; font-size: 12px; font-weight: 650; color: var(--muted); display: flex; gap: 6px; align-items: center; background: rgba(255, 250, 246, .6); padding: 6px 10px; border-radius: 999px; transition: opacity .4s; }

  .add-hot { position: absolute; left: 0; top: 0; z-index: 8; width: 74px; height: 74px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; transform: translate(-50%, -50%); box-shadow: 0 18px 30px -14px rgba(196, 103, 62, .9); transition: opacity .35s, scale .35s; }
  .add-hot::after { content: "Add"; position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); color: var(--ink); font-weight: 750; font-size: 14px; }
  .add-hot::before { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 2px dashed rgba(214, 120, 77, .5); animation: spin 12s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .add-hot:hover { scale: 1.06; }
  .add-hot.gone { opacity: 0; scale: .5; pointer-events: none; }

  .rail { position: absolute; left: 50%; bottom: 18px; z-index: 7; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; border-radius: 22px; background: rgba(255, 250, 246, .88); backdrop-filter: blur(10px); box-shadow: var(--shadow); transition: transform .6s cubic-bezier(.22, 1, .36, 1), opacity .4s; white-space: nowrap; }
  .rail.hide { transform: translate(-50%, 160%); opacity: 0; }
  .node { display: flex; align-items: center; gap: 8px; padding: 2px 4px; border: 0; background: none; border-radius: 12px; }
  .node .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--paper-3); color: var(--muted); font-size: 12px; font-weight: 800; transition: all .4s; }
  .node.on .dot { background: var(--accent); color: #fff; box-shadow: 0 0 0 5px rgba(214, 120, 77, .18); }
  .node.done .dot { background: var(--good); color: #fff; }
  .node b { display: block; font-size: 13px; text-align: left; }
  .node small { display: block; font-size: 11px; color: var(--muted); font-weight: 650; text-align: left; }
  .link { width: 46px; height: 3px; border-radius: 3px; background: var(--paper-3); position: relative; overflow: hidden; }
  .link i { position: absolute; inset: 0; background: var(--good); transform-origin: left; transform: scaleX(0); transition: transform .8s ease; }
  .link.done i { transform: scaleX(1); }
  .rail .rr-btn { margin-left: 6px; }

  .sheet { position: absolute; left: 50%; bottom: 0; z-index: 20; width: min(760px, calc(100% - 24px)); max-height: 60%; display: flex; flex-direction: column; background: var(--paper); border-radius: 28px 28px 0 0; box-shadow: 0 -20px 60px -30px rgba(120, 66, 36, .55); transform: translate(-50%, 105%); transition: transform .65s cubic-bezier(.22, 1, .36, 1); }

function equalSplit(total, ids = ALL) {
  const cents = Math.round(total * 100), base = Math.floor(cents / ids.length);

/* net position per roommate: + means the house owes them */
function netsFrom(bills, transfers = []) {
  const n = Object.fromEntries(ALL.map(id => [id, 0]));
  for (const b of bills) {
    n[b.paidBy] += b.amount;
    for (const [id, s] of Object.entries(equalSplit(b.amount, b.among))) n[id] -= s;
  }
  for (const t of transfers) { n[t.from] -= t.amount; n[t.to] += t.amount; }
  for (const id of ALL) n[id] = round2(n[id]);

function settleUp(nets) {
  const cred = [], debt = [];
  for (const [id, v] of Object.entries(nets)) { if (v > .004) cred.push([id, v]); else if (v < -.004) debt.push([id, -v]); }
  cred.sort((a, b) => b[1] - a[1]); debt.sort((a, b) => b[1] - a[1]);
  const out = [];
  let i = 0, j = 0;
  while (i < debt.length && j < cred.length) {
    const amt = round2(Math.min(debt[i][1], cred[j][1]));
    if (amt > 0) out.push({ from: debt[i][0], to: cred[j][0], amount: amt });
    debt[i][1] = round2(debt[i][1] - amt); cred[j][1] = round2(cred[j][1] - amt);
    if (debt[i][1] <= .004) i++;
    if (cred[j][1] <= .004) j++;

function buyout(item, keeperId, value = item.price) {
  const out = [];
  for (const [rid, paid] of Object.entries(item.splits)) {
    if (rid === keeperId || !(paid > 0)) continue;
    out.push({ from: keeperId, to: rid, amount: round2(value * paid / item.price), item: item.id, itemName: item.name });

    const n = (src.fileName || '').toLowerCase();
    guess = /(sofa|couch|sectional|loveseat)/.test(n) ? 'couch' : /(tv|television|monitor|screen)/.test(n) ? 'tv'
      : /(coffee|table)/.test(n) ? 'coffee_table' : /(chair|stool|seat|armchair)/.test(n) ? 'chair' : null;
    conf = guess ? .91 : .64;
    guess ||= CATEGORIES[hashStr(n || String(Math.random())) % 4].id;
    name = '';
  }
  const truth = src.sample?.truth;
  const rest = CATEGORIES.filter(c => c.id !== guess).sort((a, b) => (b.id === truth) - (a.id === truth));
  let left = round2(1 - conf);
  const ranked = [{ id: guess, p: conf }];
  rest.forEach((c, i) => {
    const p = i === rest.length - 1 ? left : round2(left * (i === 0 ? .82 : .6));
    left = round2(left - p);
    ranked.push({ id: c.id, p: Math.max(0, p) });
  });
  return { category: guess, confidence: conf, ranked, suggestedName: name, model: 'anthropic.claude-haiku-5-5 (mocked)' };
}

    el.innerHTML = esc(acc).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*\*[^*]*$/, m => m.replace('**', ''));

  }
}

async function fileToDataURL(file, max = 640) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', .85);
  } finally { URL.revokeObjectURL(url); }
}

      catch (e) {
        m.classList.add('err');

        const b = m.querySelector('[data-offline]');
        if (b) b.onclick = async () => { m.classList.remove('err'); await streamText(m, o.reply(text), scroll); };
        scroll();
      }

      await streamText(m, o.reply(text), scroll);
    }
    busy = false;
  };

  form.onsubmit = e => { e.preventDefault(); ask(inp.value); };

const Ease = {
  inOut: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  out: k => 1 - Math.pow(1 - k, 3),
  in: k => k * k * k,
  outBack: k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
  outBounce: k => { const n = 7.5625, d = 2.75; if (k < 1 / d) return n * k * k; if (k < 2 / d) return n * (k -= 1.5 / d) * k + .75; if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + .9375; return n * (k -= 2.625 / d) * k + .984375; },
  linear: k => k,
};
const tweens = new Set();
function tween(ms, fn, ease = Ease.inOut) {
  return new Promise(res => { tweens.add({ t0: performance.now(), ms, fn, ease, res }); });
}
function tickTweens(now) {
  for (const t of tweens) {
    const k = Math.min(1, Math.max(0, (now - t.t0) / t.ms));
    t.fn(t.ease(k), k);
    if (k >= 1) { tweens.delete(t); t.res(); }

}
const lerp = (a, b, k) => a + (b - a) * k;

function createRenderer(canvas) {

}

function woodTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 1024;
  const g = c.getContext('2d');
  const tones = ['#9a6c4c', '#8f6245', '#a37452', '#8a5d41', '#966a4b', '#9f7150'];
  const rows = 16, rowH = 1024 / rows;
  for (let r = 0; r < rows; r++) {
    let x = -((r * 397) % 600);
    while (x < 1024) {
      const w = 380 + ((r * 131 + x) % 260);
      g.fillStyle = tones[(r * 7 + Math.abs(Math.round(x))) % tones.length];
      g.fillRect(x, r * rowH, w, rowH);
      for (let k = 0; k < 9; k++) {
        g.strokeStyle = `rgba(80,40,15,${.05 + Math.random() * .07})`; g.lineWidth = 1 + Math.random() * 1.5;
        const y = r * rowH + 6 + Math.random() * (rowH - 12);
        g.beginPath(); g.moveTo(x, y); g.bezierCurveTo(x + w * .3, y + (Math.random() - .5) * 6, x + w * .7, y + (Math.random() - .5) * 6, x + w, y); g.stroke();
      }
      g.fillStyle = 'rgba(60,28,10,.35)'; g.fillRect(x, r * rowH, 2, rowH);
      x += w;
    }
    g.fillStyle = 'rgba(60,28,10,.32)'; g.fillRect(0, r * rowH, 1024, 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

function mesh(geo, mat) { const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true; return m; }
function rbox(w, hgt, d, r, mat) { return mesh(new RoundedBoxGeometry(w, hgt, d, 3, Math.min(r, w / 2 - .001, hgt / 2 - .001, d / 2 - .001)), mat); }
const M = {
  wall: () => new THREE.MeshStandardMaterial({ color: 0xf4efe9, roughness: .95 }),
  white: () => new THREE.MeshStandardMaterial({ color: 0xf7f4ef, roughness: .78 }),
  fabric: () => new THREE.MeshStandardMaterial({ color: 0xf1ebe4, roughness: .95 }),
  dark: () => new THREE.MeshStandardMaterial({ color: 0x34343a, roughness: .45, metalness: .2 }),

/* Room: floor x,z in [-3,3]; walls on x=-3 (left) and z=-3 (back). Viewer sits at +x,+z. */
function buildRoom({ size = 6, wallH = 3.3 } = {}) {
  const g = new THREE.Group(), S = size / 2;
  const slab = rbox(size + .36, .36, size + .36, .05, M.white()); slab.position.set(-.08, -.18, -.08); g.add(slab);
  const woodMat = new THREE.MeshStandardMaterial({ map: woodTexture(), roughness: .62 });
  woodMat.map.repeat.set(1.15, 1.15);
  const floor = mesh(new THREE.BoxGeometry(size, .04, size), woodMat); floor.position.y = .0; floor.castShadow = false; g.add(floor);
  const wallMat = M.wall();
  const left = mesh(new THREE.BoxGeometry(.24, wallH, size + .24), wallMat); left.position.set(-S - .12, wallH / 2, -.12); g.add(left);
  const back = mesh(new THREE.BoxGeometry(size, wallH, .24), wallMat); back.position.set(0, wallH / 2, -S - .12); g.add(back);
  const capMat = M.white();
  const cap1 = mesh(new THREE.BoxGeometry(.26, .03, size + .26), capMat); cap1.position.set(-S - .12, wallH + .015, -.12); g.add(cap1);
  const cap2 = mesh(new THREE.BoxGeometry(size + .02, .03, .26), capMat); cap2.position.set(0, wallH + .015, -S - .12); g.add(cap2);
  const bbMat = M.white();
  const bb1 = mesh(new THREE.BoxGeometry(.04, .14, size), bbMat); bb1.position.set(-S + .02, .07, 0); g.add(bb1);
  const bb2 = mesh(new THREE.BoxGeometry(size, .14, .04), bbMat); bb2.position.set(0, .07, -S + .02); g.add(bb2);
  // window + curtains on the left wall (echoes the reference image)
  const win = new THREE.Group(); win.position.set(-S + .005, 0, 1.45);
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.7), new THREE.MeshBasicMaterial({ color: 0xfff1df }));
  glass.rotation.y = Math.PI / 2; glass.position.set(.01, 1.75, 0); win.add(glass);
  const frameMat = M.dark();
  [[0, 2.62, 0, .05, .06, 1.6], [0, .88, 0, .05, .06, 1.6], [0, 1.75, -.78, .05, 1.8, .06], [0, 1.75, .78, .05, 1.8, .06], [0, 1.75, 0, .04, 1.74, .035]].forEach(([x, y, z, w, hh, d]) => {
    const f = mesh(new THREE.BoxGeometry(w, hh, d), frameMat); f.position.set(x + .03, y, z); win.add(f);
  });
  const rod = mesh(new THREE.CylinderGeometry(.025, .025, 2.3, 8), frameMat); rod.rotation.x = Math.PI / 2; rod.position.set(.16, 2.86, 0); win.add(rod);
  const curtMat = new THREE.MeshStandardMaterial({ color: 0xfbf8f3, roughness: 1, transparent: true, opacity: .93 });
  for (const side of [-1, 1]) for (let k = 0; k < 4; k++) {
    const p = mesh(new THREE.CylinderGeometry(.075, .075, 2.0, 10, 1, false, 0, Math.PI), curtMat);
    p.rotation.y = -Math.PI / 2; p.position.set(.16, 1.84, side * (.62 + k * .13)); win.add(p);
  }
  g.add(win);
  // soft contact shadow under the room
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: .16 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -.36; ground.receiveShadow = true; g.add(ground);
  return { group: g, floor, half: S, wallH };
}

function createLights(scene) {
  const hemi = new THREE.HemisphereLight(0xfff5ec, 0xe7c4ad, 1.15); scene.add(hemi);
  const key = new THREE.DirectionalLight(0xffe3c6, 2.3);
  key.position.set(5, 11, 7); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 30 });
  key.shadow.bias = -.0004; key.shadow.normalBias = .02; key.shadow.radius = 4;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xffa868, 1.0); rim.position.set(9, 3.5, -3); scene.add(rim);
  const fill = new THREE.AmbientLight(0xffffff, .28); scene.add(fill);
  const MOODS = {
    day: { hemi: [0xfff5ec, 0xe7c4ad, 1.15], key: [0xffe3c6, 2.3, [5, 11, 7]], rim: [0xffa868, 1.0], fill: .28, exp: 1.08 },
    morning: { hemi: [0xf4f6ff, 0xe9d6c8, 1.25], key: [0xfff3e6, 1.9, [-2, 11, 8]], rim: [0xffd2a8, .55], fill: .34, exp: 1.12 },
    golden: { hemi: [0xffe6cf, 0xd99c7d, .95], key: [0xffb27a, 2.5, [8, 8.5, 6]], rim: [0xff8a48, 1.5], fill: .2, exp: 1.05 },
    dusk: { hemi: [0xc9c3e6, 0xb99484, .8], key: [0xffa77a, 1.1, [8, 7, 5]], rim: [0xb48cff, .7], fill: .24, exp: 1.0 },
  };
  let cur = structuredClone(MOODS.day);
  const C = (a, b, k) => new THREE.Color(a).lerp(new THREE.Color(b), k);
  function apply(m) {
    hemi.color.set(m.hemi[0]); hemi.groundColor.set(m.hemi[1]); hemi.intensity = m.hemi[2];
    key.color.set(m.key[0]); key.intensity = m.key[1]; key.position.set(...m.key[2]);
    rim.color.set(m.rim[0]); rim.intensity = m.rim[1]; fill.intensity = m.fill;
  }
  return {
    hemi, key, rim, fill,
    setMood(name, ms = 1600, renderer) {
      const from = structuredClone(cur), to = MOODS[name];
      return tween(ms, k => {
        const m = {
          hemi: [C(from.hemi[0], to.hemi[0], k), C(from.hemi[1], to.hemi[1], k), lerp(from.hemi[2], to.hemi[2], k)],
          key: [C(from.key[0], to.key[0], k), lerp(from.key[1], to.key[1], k), from.key[2].map((v, i) => lerp(v, to.key[2][i], k))],
          rim: [C(from.rim[0], to.rim[0], k), lerp(from.rim[1], to.rim[1], k)], fill: lerp(from.fill, to.fill, k),
        };
        apply(m);
        if (renderer) renderer.toneMappingExposure = lerp(from.exp, to.exp, k);
        if (k === 1) cur = structuredClone(to);
      });
    },
  };
}

/* deterministic layout - each category has favourite spots; overflow uses the free floor */
const COFFEE = { x: .25, z: -.75 };
const faceTo = (x, z, t = COFFEE) => Math.atan2(t.x - x, t.z - z);
const SLOTS = {
  couch: [{ x: .25, z: -2.35, r: 0 }, { x: 2.15, z: .1, r: -Math.PI / 2 }],
  tv: [{ x: -2.68, z: -.75, r: Math.PI / 2 }, { x: 1.9, z: -2.7, r: 0 }],
  coffee_table: [{ x: .25, z: -.75, r: 0 }, { x: -1.2, z: 1.7, r: .3 }],
  chair: [{ x: 2.05, z: -.8 }, { x: -1.2, z: 1.3 }, { x: 1.75, z: 1.4 }, { x: .4, z: 2.1 }].map(s => ({ ...s, r: faceTo(s.x, s.z) })),
};
const OVERFLOW = [{ x: -1.6, z: 2.2 }, { x: .9, z: 2.3 }, { x: 2.3, z: 2.2 }, { x: -2.2, z: -2.2 }, { x: 2.3, z: -2.3 }].map(s => ({ ...s, r: faceTo(s.x, s.z) }));
function pickSlot(cat, items) {
  const taken = new Set(items.map(i => i.slotKey));
  const list = (SLOTS[cat] || []).map((s, i) => ({ ...s, key: cat + i })).concat(OVERFLOW.map((s, i) => ({ ...s, key: 'o' + i })));
  return list.find(s => !taken.has(s.key)) || { x: (Math.random() - .5) * 3, z: (Math.random() - .5) * 3, r: 0, key: uid('free') };
}

function setGlow(obj, amt, color = 0xff9a5c) {
  obj.traverse(o => { if (o.isMesh && o.material?.emissive && !o.userData.keepEmissive) { o.material.emissive.set(color); o.material.emissiveIntensity = amt; } });
}
function setOpacity(obj, a) {
  obj.traverse(o => { if (o.isMesh) { o.material.transparent = a < 1; o.material.opacity = a; o.material.depthWrite = a > .5; } });
}
function itemRootOf(obj) { while (obj && !obj.userData.itemId) obj = obj.parent; return obj; }
function puff(scene, at, color = 0xffffff, n = 14) {
  const geo = new THREE.SphereGeometry(.08, 8, 6);
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness: 1, transparent: true }));
    const a = (i / n) * Math.PI * 2, sp = .8 + Math.random() * .8;
    m.position.copy(at); scene.add(m);
    tween(700 + Math.random() * 300, k => {
      m.position.set(at.x + Math.cos(a) * sp * k, at.y + .2 + k * .6 + Math.sin(k * 3) * .1, at.z + Math.sin(a) * sp * k);
      m.scale.setScalar(1 + k * 1.6); m.material.opacity = 1 - k;
    }, Ease.out).then(() => { scene.remove(m); m.material.dispose(); });
  }
}
function projectToScreen(v3, camera, rect) {
  const p = v3.clone().project(camera);
  return { x: rect.left + (p.x + 1) / 2 * rect.width, y: rect.top + (1 - p.y) / 2 * rect.height, behind: p.z > 1 };
}

}
function spawnGhost(cat) {
  const prev = ghost ? { x: ghost.position.x, z: ghost.position.z, r: ghost.rotation.y } : null;
  dropGhost(true);
  const slot = prev || pickSlot(cat, house.items);
  ghost = buildModel(cat); ghostify(ghost);
  ghost.position.set(slot.x, 0, slot.z); ghost.rotation.y = slot.r ?? 0; ghost.userData.slotKey = prev ? null : slot.key;
  const s = ghost.userData.size;
  ghostRing = new THREE.Mesh(new THREE.RingGeometry(.92, 1, 48), new THREE.MeshBasicMaterial({ color: 0xd6784d, transparent: true, opacity: .7, depthWrite: false }));
  ghostRing.rotation.x = -Math.PI / 2; ghostRing.scale.set(Math.max(s.w, s.d) * .62, Math.max(s.w, s.d) * .62, 1);
  ghostRing.position.set(slot.x, .03, slot.z);
  itemsGroup.add(ghost, ghostRing);
  ghost.scale.setScalar(.01); tween(450, k => ghost.scale.setScalar(Math.max(.01, k)), Ease.outBack);
}
function dropGhost(instant) {
  if (!ghost) return;
  const g = ghost, r = ghostRing; ghost = ghostRing = null;
  if (instant) { itemsGroup.remove(g, r); return; }
  tween(250, k => g.scale.setScalar(Math.max(.01, 1 - k))).then(() => itemsGroup.remove(g, r));
}
function commitPlace() {
  const res = A.form.read();
  if (res.error) { toast(res.error); return; }
  const pos = { x: ghost.position.x, z: ghost.position.z, r: ghost.rotation.y };
  const item = { id: uid('it'), ...res.value, category: A.cat, photo: A.photo, slotKey: ghost.userData.slotKey || uid('manual') };
  itemsGroup.remove(ghost, ghostRing); ghost = ghostRing = null;
  house.items.push(item);
  const m = buildModel(item.category); m.userData.itemId = item.id;
  m.position.set(pos.x, 0, pos.z); m.rotation.y = pos.r;
  itemsGroup.add(m); objs.set(item.id, m);
  tween(520, k => { m.scale.set(1 + Math.sin(k * Math.PI) * .08, Math.max(.01, Ease.outBack(k)), 1 + Math.sin(k * Math.PI) * .08); });
  dustRing(pos.x, pos.z);
  sheetMode = null; $('#sheet').classList.remove('open'); view.toy = 0;
  house.changed(); refresh();
  toast(`${icon(item.category, 16)} ${esc(item.name)} placed · ${money(item.price)} split ${Object.keys(item.splits).length} ways`);
}
function dustRing(x, z) {
  const ring = new THREE.Mesh(new THREE.RingGeometry(.6, .75, 40), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .8, depthWrite: false }));
  ring.rotation.x = -Math.PI / 2; ring.position.set(x, .04, z); itemsGroup.add(ring);
  tween(700, k => { ring.scale.setScalar(1 + k * 1.6); ring.material.opacity = .8 * (1 - k); }, Ease.out).then(() => itemsGroup.remove(ring));
}
$('#addHot').onclick = openAdd;

/* ---------------- pointer: orbit vs click vs ghost drag ---------------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
let down = null, hovered = null, focused = null;
function setRay(e) { const r = canvas.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1); ray.setFromCamera(ndc, cam); }
function hitItem(e) { setRay(e); const h2 = ray.intersectObjects([...objs.values()], true)[0]; return h2 ? itemRootOf(h2.object) : null; }
function hitGhost(e) { if (!ghost) return false; setRay(e); return ray.intersectObject(ghost, true).length > 0; }
canvas.addEventListener('pointerdown', e => {
  down = { x: e.clientX, y: e.clientY };
  if (hitGhost(e)) { dragging = true; controls.enabled = false; document.body.classList.add('dragging'); canvas.setPointerCapture(e.pointerId); }
});
canvas.addEventListener('pointermove', e => {
  if (dragging && ghost) {
    setRay(e); const p = new THREE.Vector3();
    if (ray.ray.intersectPlane(floorPlane, p)) {
      const s = ghost.userData.size, m = Math.max(s.w, s.d) / 2 * .9, lim = room.half;
      ghost.position.x = Math.min(lim - m, Math.max(-lim + m, p.x)); ghost.position.z = Math.min(lim - m, Math.max(-lim + m, p.z));
      ghost.userData.slotKey = null; ghostRing.position.set(ghost.position.x, .03, ghost.position.z);
    }
    return;
  }
  if (phase === 'login') return;
  document.body.classList.toggle('overghost', hitGhost(e));
  const o = sheetMode === 'add' ? null : hitItem(e);
  if (o !== hovered) { if (hovered && hovered !== focused) setGlow(hovered, 0); hovered = o; if (o && o !== focused) setGlow(o, .14); }
  document.body.classList.toggle('hovering', !!o);
  const tip = $('#tip');
  if (o && o !== focused) { tip.textContent = house.items.find(i => i.id === o.userData.itemId)?.name || ''; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; tip.classList.add('on'); } else tip.classList.remove('on');
});
canvas.addEventListener('pointerup', e => {
  if (dragging) { dragging = false; controls.enabled = true; document.body.classList.remove('dragging'); return; }
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5 || phase === 'login' || sheetMode === 'add') return;
  const o = hitItem(e);
  if (o) openItem(o.userData.itemId); else if (sheetMode === 'item') closeSheet();
});
canvas.addEventListener('pointerleave', () => $('#tip').classList.remove('on'));
controls.addEventListener('start', () => { $('#orbitHint').style.opacity = 0; });
addEventListener('keydown', e => { if (e.key === 'Escape' && sheetMode) closeSheet(); if ((e.key === 'r' || e.key === 'R') && ghost && document.activeElement?.tagName !== 'INPUT') $('#rotBtn')?.click(); });

/* ---------------- item card + move-out ---------------- */
const camGoal = { target: new THREE.Vector3(-.2, .9, -.2), active: false };
function focusOn(o) { focused = o; setGlow(o, .2); camGoal.target.copy(o.position).add(new THREE.Vector3(0, .7, 0)); camGoal.active = true; }
function unfocus() { if (focused) setGlow(focused, 0); focused = null; camGoal.target.set(-.2, .9, -.2); camGoal.active = true; }
function openItem(id) {
  const item = house.items.find(i => i.id === id); if (!item) return;
  if (focused) setGlow(focused, 0);
  focusOn(objs.get(id)); $('#tip').classList.remove('on');
  const parts = Object.entries(item.splits);
  openSheet('item',
    `<div><span class="rr-pill">${icon(item.category, 12)}${CAT[item.category].label}</span><h3 style="margin-top:6px">${esc(item.name)}</h3></div>${closeBtn}`,
    `<div class="card-grid"><img src="${item.photo}" alt=""><div>
      <div class="facts"><div>Paid<b>${money2(item.price)}</b></div><div>Bought<b>${fmtDate(item.date)}</b></div><div>Owners<b>${parts.length}</b></div></div>
      <div class="stackbar">${parts.map(([rid, v]) => `<i style="flex:${v};background:${RM[rid].color}"></i>`).join('')}</div>
      <div class="legend">${parts.map(([rid, v]) => `<span><i style="background:${RM[rid].color}"></i>${nameOf(rid)} ${money2(v)}</span>`).join('')}</div></div></div>`,
    `<span class="grow">Leaving the place? Settle this item before you go.</span><button class="rr-btn dark" id="moBtn">${icon('box', 16)}Start move-out</button>`);
  $('#moBtn').onclick = () => moveOutStep(item);
}
function moveOutStep(item) {
  const sug = suggestedValue(item);
  let keeper = null, value = sug.value;
  openSheet('item',
    `<div><h3>Who keeps the ${esc(item.name)}?</h3><p>They buy out everyone else's share at an agreed value.</p></div>${closeBtn}`,
    `<div class="keepers">${ROOMMATES.map(r => `<button class="keeper" data-k="${r.id}">${av(r.id, 40)}${r.name}<small>${item.splits[r.id] ? 'owns ' + Math.round(item.splits[r.id] / item.price * 100) + '%' : 'not an owner'}</small></button>`).join('')}</div>
     <div class="value"><div class="row"><span class="rr-muted rr-small" style="font-weight:750;text-transform:uppercase;letter-spacing:.07em">Value at move-out</span><span class="amt" id="valAmt"></span></div>
       <input type="range" id="valRange" min="0" max="${Math.ceil(item.price)}" step="1" value="${value}">
       <div class="row"><div class="presets"><button class="rr-btn soft sm" data-v="${sug.value}">Suggested ${money(sug.value)}</button><button class="rr-btn ghost sm" data-v="${item.price}">Full price ${money(item.price)}</button><button class="rr-btn ghost sm" data-v="${Math.round(item.price / 2)}">Half</button></div>
       <span class="rr-muted rr-small">Suggested: 20% a year of straight-line wear (minimum 3 months), bought ${sug.years < 1 ? Math.max(1, Math.round(sug.years * 12)) + ' months' : sug.years.toFixed(1) + ' years'} ago</span></div></div>
     <div class="flows" id="flows"><div class="rr-empty-note">Pick who keeps it to see who owes whom.</div></div>`,
    `<button class="rr-btn ghost" id="bk">Back</button><span class="grow"></span><button class="rr-btn" id="packBtn" disabled>${icon('box', 16)}Pack it up</button>`);
  const paint = () => {
    $('#valAmt').textContent = money(value);
    if (!keeper) return;
    const t = buyout(item, keeper, value);
    $('#flows').innerHTML = t.length ? t.map(x => `<div class="flow">${av(x.from, 28)}<span class="line"></span>${av(x.to, 28)}<b>${money2(x.amount)}</b></div>`).join('') + `<div class="rr-muted rr-small">${nameOf(keeper)} pays ${t.map(x => `${RM[x.to].name} ${money2(x.amount)}`).join(' and ')}</div>` : `<div class="rr-empty-note">${nameOf(keeper)} owned all of it, so no money changes hands.</div>`;
  };
  document.querySelectorAll('.keeper').forEach(b => b.onclick = () => { keeper = b.dataset.k; document.querySelectorAll('.keeper').forEach(x => x.classList.toggle('on', x === b)); $('#packBtn').disabled = false; paint(); });
  $('#valRange').oninput = e => { value = +e.target.value; paint(); };
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { value = +b.dataset.v; $('#valRange').value = value; paint(); });
  $('#bk').onclick = () => openItem(item.id);
  $('#packBtn').onclick = () => packOut(item, keeper, value);
  paint();
}
async function packOut(item, keeperId, value) {
  const o = objs.get(item.id);
  sheetMode = null; $('#sheet').classList.remove('open'); view.toy = 0;
  setGlow(o, 0); focused = null;
  const t = confirmMoveOut(item, keeperId, value);
  if (phase !== 'moveout') setPhase('moveout'); else refresh();
  const s = o.userData.size;
  const box = new THREE.Group();
  const card = new THREE.MeshStandardMaterial({ color: 0xc9a27c, roughness: .9 });
  const bw = s.w + .12, bd = s.d + .12, bh = Math.min(s.h, 1.2) + .1;
  const body = mesh(new THREE.BoxGeometry(bw, bh, bd), card); body.position.y = bh / 2; box.add(body);
  const tape = mesh(new THREE.BoxGeometry(bw + .01, .02, .16), M.color(0xe9d8b8)); tape.position.y = bh + .005; box.add(tape);
  box.position.copy(o.position); box.rotation.y = o.rotation.y; box.scale.set(1, .01, 1);
  itemsGroup.add(box);
  await tween(450, k => box.scale.y = Math.max(.01, k), Ease.outBack);
  o.visible = false;
  await tween(260, k => box.scale.set(1 - k * .06, 1 + k * .08, 1 - k * .06));
  const p0 = box.position.clone(), dir = new THREE.Vector3(4.6, 0, 4.6).sub(p0).normalize();
  await tween(1000, k => {
    box.position.set(p0.x + dir.x * k * 6, Math.abs(Math.sin(k * Math.PI * 3)) * .25 * (1 - k) - (k > .7 ? (k - .7) * 6 : 0), p0.z + dir.z * k * 6);
    box.rotation.z = Math.sin(k * 20) * .05;
  }, Ease.in);
  itemsGroup.remove(box, o); objs.delete(item.id); controls.target.y = .9; unfocus();
  toast(`${icon('box', 16)} Packed. ${RM[keeperId].name} keeps it${t.length ? ' · owes ' + t.map(x => `${RM[x.to].name} ${money2(x.amount)}`).join(', ') : ''}`, 3600);
  if (!house.items.length) setTimeout(showEnd, 700);
}
function showEnd() {
  setPhase('ended');
  const net = settleUp(netsFrom([], house.buyouts));
  openSheet('end',
    `<div><h3>Room cleared. Here's the final settlement</h3><p>Every shared item is packed and paid for. Bills stay in the ledger until they're marked paid.</p></div>`,
    `<table class="sumtable"><thead><tr><th>Roommate</th><th>Kept</th><th>Net furniture buyouts</th></tr></thead><tbody>${ROOMMATES.map(r => {
      const n = netsFrom([], house.buyouts)[r.id];
      return `<tr><td>${av(r.id, 26)} ${r.name}</td><td>${(house.keptBy[r.id] || []).map(i => esc(i.name)).join(', ') || '<span class="rr-muted">nothing</span>'}</td><td style="color:${n >= 0 ? 'var(--good)' : 'var(--accent-2)'}">${n >= 0 ? 'receives ' : 'pays '}${money2(Math.abs(n))}</td></tr>`;
    }).join('')}</tbody></table>
    <div class="flows">${net.map(x => `<div class="flow">${av(x.from, 28)}<span class="line"></span>${av(x.to, 28)}<b>${money2(x.amount)}</b></div>`).join('')}</div>`,
    `<button class="rr-btn ghost" onclick="toast('Mock: would export a PDF summary')">Download summary</button><button class="rr-btn" onclick="location.reload()">Start a new place</button>`);
  window.toast = toast;
}

/* ---------------- shortcuts, login, loop ---------------- */
$('#archBtn').onclick = () => openArch({
  title: "Option B · How it's built", sub: 'Orbitable studio view, panels that reflow the layout, bottom sheets, drag-to-place ghost, depreciation-aware buyout.',
  bullets: ['<b>Camera</b>: perspective camera with clamped OrbitControls (two walls always face the viewer), so roommates can peek around furniture.',
    '<b>Room shift</b>: chat and bills are real CSS grid columns. Opening one animates <code>grid-template-columns</code>; a <code>ResizeObserver</code> resizes the canvas every frame of the transition and the room re-centres in the remaining space. This is the most "app-like" choice, and the canvas has to be resized on every frame of the transition.',
    '<b>Placement</b>: after classification a translucent ghost of the generic model appears; dragging raycasts onto the floor plane. Positions are stored per item, so the room matches the real layout.',
    '<b>Move-out</b>: keeper plus a value slider (purchase price, a 20%/yr straight-line suggestion, or custom). The box-and-carry animation is pure three.js.', ...ARCH_COMMON],
});
function quickFill() { SAMPLES.forEach((s, i) => setTimeout(() => {
  const slot = pickSlot(s.truth, house.items), item = { id: uid('it'), name: s.name, price: s.price, date: s.date, category: s.truth, photo: samplePhoto(s.draw), splits: equalSplit(s.price), slotKey: slot.key };
  house.items.push(item); const m = buildModel(item.category); m.userData.itemId = item.id; m.position.set(slot.x, 0, slot.z); m.rotation.y = slot.r; itemsGroup.add(m); objs.set(item.id, m);
  tween(520, k => m.scale.set(1, Math.max(.01, Ease.outBack(k)), 1)); dustRing(slot.x, slot.z); house.changed(); refresh();
}, i * 220)); }
$('#fillBtn').onclick = () => { if (phase === 'login') return; if (sheetMode) closeSheet(); quickFill(); };
$('#skipBtn').onclick = () => { if (phase !== 'movein') return; if (sheetMode) closeSheet(); if (!house.items.length) quickFill(); setTimeout(() => setPhase('living'), 950); };
$('#resetBtn').onclick = () => location.reload();
$('#loginForm').onsubmit = e => {
  e.preventDefault(); $('#login').classList.add('gone');
  room.group.children.forEach((c, i) => { if (c === itemsGroup || c.geometry?.type === 'PlaneGeometry') return; const y = c.scale.y; c.scale.y = .001; setTimeout(() => tween(700, k => c.scale.y = Math.max(.001, k * y), Ease.outBack), 120 + i * 45); });
  setPhase('movein');
};
window.__rr = { house, openItem, packOut, setPhase };

resize(); layoutCols(); paintRail();
const anchor = new THREE.Vector3();
let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  tickTweens(now);
  if (camGoal.active) { controls.target.lerp(camGoal.target, 1 - Math.exp(-dt * 4)); if (controls.target.distanceTo(camGoal.target) < .01) camGoal.active = false; }
  controls.update();
  view.oy += (view.toy - view.oy) * (1 - Math.exp(-dt * 6));
  const w = stage.clientWidth, hgt = stage.clientHeight;
  const targetZoom = Math.min(1, (w / hgt) / 1.25) * (1 - view.oy * 1.2 / hgt);
  view.zoom += (targetZoom - view.zoom) * (1 - Math.exp(-dt * 6));
  cam.zoom = Math.max(.42, view.zoom);
  cam.setViewOffset(w, hgt, 0, view.oy, w, hgt);
  if (ghost) { ghost.position.y = .06 + Math.sin(now / 300) * .04; ghostRing.material.opacity = .45 + Math.sin(now / 300) * .25; }
  const hot = projectToScreen(anchor.set(0, .05, 0), cam, { left: 0, top: 0, width: w, height: hgt });
  Object.assign($('#addHot').style, { left: hot.x + 'px', top: hot.y + 'px' });
  renderer.render(scene, cam);
});
</script>
