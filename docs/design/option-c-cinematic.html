<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roomie Room · Option C · Cinematic in-world</title>
<style>/* ---------- shared tokens + components (inlined into every option) ---------- */
*, *::before, *::after { box-sizing: border-box; }
:root {
  --bg: #f2ddd0; --bg-2: #ebd0c0; --paper: #fffaf6; --paper-2: #fbf2ea; --paper-3: #f6e8dd;
  --ink: #3a2e28; --ink-2: #5b4a40; --muted: #8c786c; --line: rgba(58, 46, 40, .1); --line-2: rgba(58, 46, 40, .18);
  --accent: #d6784d; --accent-2: #c4673e; --accent-soft: #f7dccb; --sage: #6fa38c; --lilac: #8f8fcf; --good: #4f9a76; --warn: #c9853a;
  --shadow: 0 24px 60px -28px rgba(120, 66, 36, .45), 0 2px 8px rgba(120, 66, 36, .08);
  --shadow-sm: 0 8px 22px -12px rgba(120, 66, 36, .45);
  --r: 20px; --r-sm: 12px;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4, p { margin: 0; }
.rr-hidden { display: none !important; }
.rr-muted { color: var(--muted); }
.rr-small { font-size: 12px; }

.rr-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; padding: 11px 18px; background: var(--accent); color: #fff; font-weight: 650; font-size: 14px; letter-spacing: .01em; box-shadow: 0 10px 22px -12px rgba(196, 103, 62, .9); transition: transform .18s ease, background .18s ease, box-shadow .18s ease, opacity .18s; white-space: nowrap; }
.rr-btn:hover { background: var(--accent-2); transform: translateY(-1px); }
.rr-btn:active { transform: translateY(0) scale(.98); }
.rr-btn:disabled { opacity: .45; pointer-events: none; }
.rr-btn.ghost { background: transparent; color: var(--ink-2); box-shadow: none; border: 1px solid var(--line-2); }
.rr-btn.ghost:hover { background: rgba(255, 255, 255, .6); }
.rr-btn.soft { background: var(--accent-soft); color: var(--accent-2); box-shadow: none; }
.rr-btn.dark { background: var(--ink); box-shadow: 0 10px 22px -12px rgba(30, 20, 10, .8); }
.rr-btn.sm { padding: 7px 12px; font-size: 13px; }
.rr-btn.block { width: 100%; }
.rr-btn svg { flex: none; }

.rr-pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 650; background: var(--paper-3); color: var(--ink-2); white-space: nowrap; }
.rr-pill.ai { background: #efe9fb; color: #5d4fa8; }
.rr-pill.good { background: #e2f1e8; color: #2f7553; }
.rr-pill.warn { background: #fbecd9; color: #9a5d1d; }

.rr-av { --s: 28px; --c: #ccc; display: inline-grid; place-items: center; width: var(--s); height: var(--s); border-radius: 50%; background: var(--c); color: #fff; font-weight: 750; font-size: calc(var(--s) * .44); box-shadow: 0 0 0 2px var(--paper); flex: none; }
.rr-avs { display: inline-flex; }
.rr-avs .rr-av + .rr-av { margin-left: -7px; }

.rr-field { display: grid; gap: 6px; font-size: 12px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.rr-field > span:first-child { padding-left: 2px; }
.rr-input { width: 100%; min-width: 0; border: 1px solid var(--line-2); background: #fff; border-radius: var(--r-sm); padding: 10px 12px; font-size: 15px; font-weight: 550; color: var(--ink); text-transform: none; letter-spacing: 0; outline: none; transition: border-color .15s, box-shadow .15s; }
.rr-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(214, 120, 77, .15); }
.rr-money { position: relative; }
.rr-money > b { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; font-size: 15px; }
.rr-money > .rr-input { padding-left: 24px; }
.rr-grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.rr-stack { display: grid; gap: 14px; }

.rr-seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--paper-3); gap: 2px; text-transform: none; letter-spacing: 0; }
.rr-seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 650; color: var(--muted); }
.rr-seg button.on { background: #fff; color: var(--ink); box-shadow: var(--shadow-sm); }

.rr-splits { display: grid; gap: 6px; text-transform: none; letter-spacing: 0; }
.rr-split-row { display: grid; grid-template-columns: auto minmax(0, 1fr) 110px 44px; align-items: center; gap: 10px; padding: 6px 8px 6px 6px; border-radius: 14px; background: #fff; border: 1px solid var(--line); transition: opacity .2s; }
.rr-split-row.off { opacity: .45; }
.rr-split-row .who { font-size: 14px; font-weight: 650; color: var(--ink); display: flex; align-items: center; gap: 8px; min-width: 0; }
.rr-split-row .who input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.rr-split-row .pct { font-size: 12px; color: var(--muted); text-align: right; font-weight: 600; }
.rr-split-row .rr-input { padding: 6px 8px 6px 20px; font-size: 14px; }
.rr-split-row .rr-money > b { left: 8px; font-size: 13px; }
.rr-split-sum { font-size: 12px; font-weight: 650; text-transform: none; letter-spacing: 0; }
.rr-split-sum.ok { color: var(--good); }
.rr-split-sum.bad { color: var(--warn); }

.rr-cats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.rr-cat { position: relative; display: grid; justify-items: center; gap: 6px; padding: 12px 6px 10px; border-radius: 16px; border: 1.5px solid var(--line-2); background: #fff; font-size: 12px; font-weight: 700; color: var(--ink-2); transition: all .18s; }
.rr-cat:hover { border-color: var(--accent); }
.rr-cat.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-2); box-shadow: 0 0 0 3px rgba(214, 120, 77, .12); }
.rr-cat .p { position: absolute; top: 5px; right: 6px; font-size: 10px; font-weight: 700; color: var(--muted); }
.rr-cat.on .p { color: var(--accent-2); }

.rr-drop { display: grid; place-items: center; gap: 8px; text-align: center; border: 2px dashed var(--line-2); border-radius: var(--r); padding: 26px 16px; background: rgba(255, 255, 255, .55); cursor: pointer; transition: all .18s; }
.rr-drop:hover, .rr-drop.over { border-color: var(--accent); background: #fff; }
.rr-drop .ic { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-2); }
.rr-drop b { font-size: 15px; }
.rr-drop input { display: none; }
.rr-samples { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.rr-sample { border: 1.5px solid transparent; border-radius: 12px; padding: 0; overflow: hidden; background: #fff; aspect-ratio: 4 / 3; box-shadow: var(--shadow-sm); transition: all .18s; position: relative; }
.rr-sample:hover { border-color: var(--accent); transform: translateY(-2px); }
.rr-sample img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rr-sample span { position: absolute; left: 4px; bottom: 4px; font-size: 10px; font-weight: 700; background: rgba(255, 255, 255, .85); border-radius: 6px; padding: 1px 5px; }

.rr-scan { position: relative; overflow: hidden; border-radius: 14px; }
.rr-scan img { display: block; width: 100%; height: 100%; object-fit: cover; }
.rr-scan.on::after { content: ""; position: absolute; left: 0; right: 0; height: 40%; top: -40%; background: linear-gradient(180deg, transparent, rgba(255, 210, 180, .55), transparent); animation: rr-scan 1.1s ease-in-out infinite; }
@keyframes rr-scan { to { top: 100%; } }
.rr-thinking { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 650; color: #5d4fa8; }
.rr-dots { display: inline-flex; gap: 3px; }
.rr-dots i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: rr-bounce 1s infinite ease-in-out; }
.rr-dots i:nth-child(2) { animation-delay: .15s; }
.rr-dots i:nth-child(3) { animation-delay: .3s; }
@keyframes rr-bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-4px); opacity: 1; } }

/* panel content: chat + bills */
.rr-panel { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.rr-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
.rr-panel-head h3 { font-size: 18px; font-weight: 750; letter-spacing: -.01em; }
.rr-panel-head p { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.rr-panel-body { flex: 1; min-height: 0; overflow: auto; padding: 16px 20px 20px; scrollbar-width: thin; }

.rr-chatlog { display: grid; gap: 10px; align-content: start; }
.rr-msg { max-width: 88%; padding: 10px 13px; border-radius: 16px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.rr-msg.ai { background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 6px; justify-self: start; }
.rr-msg.me { background: var(--accent); color: #fff; border-bottom-right-radius: 6px; justify-self: end; }
.rr-msg.ai b { color: var(--accent-2); }
.rr-msg.ai.err { border-color: rgba(196, 82, 62, .45); background: #fff6f3; }
.rr-msg.ai.err b { color: #a5402e; }
.rr-msg .rr-chip { margin-top: 8px; }
.rr-msg-meta { font-size: 10px; color: var(--muted); font-weight: 650; margin: 2px 4px -4px; }
.rr-suggest { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 20px 0; }
.rr-chip { border: 1px solid var(--line-2); background: #fff; border-radius: 999px; padding: 6px 11px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); transition: all .15s; text-align: left; }
.rr-chip:hover { border-color: var(--accent); color: var(--accent-2); }
.rr-chatbar { display: flex; gap: 8px; padding: 12px 16px 16px; }
.rr-chatbar .rr-input { border-radius: 999px; padding: 11px 16px; }
.rr-chatbar .rr-btn { padding: 0; width: 44px; height: 44px; flex: none; }
.rr-ai-foot { font-size: 11px; color: var(--muted); padding: 0 20px 12px; }

.rr-bal { border-radius: 18px; padding: 16px; background: linear-gradient(135deg, #fff, var(--paper-2)); border: 1px solid var(--line); display: grid; gap: 10px; }
.rr-bal .big { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.rr-bal .big.pos { color: var(--good); }
.rr-bal .big.neg { color: var(--accent-2); }
.rr-xfer { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 7px 8px; border-radius: 12px; background: rgba(255, 255, 255, .7); }
.rr-xfer .arrow { color: var(--muted); }
.rr-xfer .amt { font-weight: 800; }
.rr-xfer .who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rr-xfer .rr-btn { padding: 4px 10px; font-size: 11.5px; }
.rr-sec { display: flex; align-items: center; justify-content: space-between; margin: 20px 0 8px; font-size: 12px; font-weight: 750; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.rr-bills { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rr-bill { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 14px; background: #fff; border: 1px solid var(--line); animation: rr-in .35s ease both; }
.rr-bill .ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--paper-3); color: var(--ink-2); }
.rr-bill .t { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rr-bill .s { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.rr-bill .a { font-size: 14px; font-weight: 800; text-align: right; }
.rr-bill .a small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
.rr-addbill { display: grid; gap: 10px; padding: 12px; border-radius: 16px; background: var(--paper-2); border: 1px solid var(--line); margin-bottom: 8px; animation: rr-in .3s ease both; }
.rr-who-pick { display: flex; gap: 6px; flex-wrap: wrap; }
.rr-who-pick label { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; background: #fff; border: 1px solid var(--line-2); font-size: 13px; font-weight: 650; text-transform: none; letter-spacing: 0; color: var(--ink); cursor: pointer; }
.rr-who-pick input { display: none; }
.rr-who-pick label:has(input:not(:checked)) { opacity: .45; }
.rr-stake { display: grid; gap: 8px; }
.rr-stake-row { display: grid; grid-template-columns: 70px minmax(0, 1fr) 70px; gap: 8px; align-items: center; font-size: 13px; font-weight: 650; }
.rr-stake-row .bar { height: 8px; border-radius: 99px; background: var(--paper-3); overflow: hidden; }
.rr-stake-row .bar i { display: block; height: 100%; border-radius: 99px; transition: width .5s ease; }
.rr-stake-row .v { text-align: right; }
.rr-empty-note { font-size: 13px; color: var(--muted); padding: 12px; border-radius: 14px; border: 1px dashed var(--line-2); text-align: center; }

.rr-toast-wrap { position: fixed; left: 50%; top: 78px; transform: translateX(-50%); display: grid; gap: 8px; z-index: 200; pointer-events: none; }
.rr-toast { background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 650; box-shadow: var(--shadow); animation: rr-toast .35s cubic-bezier(.2, .9, .3, 1.3) both; display: flex; gap: 8px; align-items: center; }
.rr-toast.out { animation: rr-toast-out .3s ease both; }
@keyframes rr-toast { from { opacity: 0; transform: translateY(-12px) scale(.96); } }
@keyframes rr-toast-out { to { opacity: 0; transform: translateY(-8px); } }
@keyframes rr-in { from { opacity: 0; transform: translateY(6px); } }

/* reviewer shortcuts + architecture note */
.rr-review { display: inline-flex; gap: 6px; align-items: center; padding: 4px; border-radius: 999px; border: 1px dashed rgba(58, 46, 40, .3); background: rgba(255, 255, 255, .45); backdrop-filter: blur(6px); }
.rr-review > span { font-size: 10.5px; font-weight: 750; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0 4px 0 8px; }
.rr-review button { border: 0; background: #fff; border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 650; color: var(--ink-2); box-shadow: var(--shadow-sm); }
.rr-review button:hover { color: var(--accent-2); }
.rr-arch-back { position: fixed; inset: 0; background: rgba(58, 40, 30, .28); backdrop-filter: blur(4px); display: grid; place-items: center; z-index: 300; animation: rr-fade .25s ease both; padding: 20px; }
@keyframes rr-fade { from { opacity: 0; } }
.rr-arch { width: min(820px, 100%); max-height: calc(100vh - 40px); overflow: auto; background: var(--paper); border-radius: 26px; box-shadow: var(--shadow); padding: 24px 26px; animation: rr-pop .35s cubic-bezier(.2, .9, .3, 1.2) both; }
@keyframes rr-pop { from { opacity: 0; transform: translateY(14px) scale(.97); } }
.rr-arch h2 { font-size: 20px; letter-spacing: -.01em; }
.rr-arch .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.rr-arch svg { width: 100%; height: auto; margin: 14px 0 6px; }
.rr-arch ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13.5px; line-height: 1.45; color: var(--ink-2); }
.rr-arch code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; background: var(--paper-3); padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere; }
.rr-arch .close { float: right; }
</style>
<style>
  body { background: radial-gradient(1300px 900px at 50% 40%, #f8e8dd 0%, #f0d6c6 60%, #e7c6b2 100%); transition: background 1.6s; }
  body.mood-golden { background: radial-gradient(1300px 900px at 60% 40%, #fbe3cf 0%, #f3cba9 60%, #e9b38e 100%); }
  body.mood-dusk { background: radial-gradient(1300px 900px at 50% 40%, #e9d9e4 0%, #d6c0cf 60%, #bfa6ba 100%); }
  #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  body.hovering #scene { cursor: pointer; }
  .hand { font-family: "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive; }

  .topbar { position: fixed; inset: 0 0 auto 0; display: flex; justify-content: space-between; align-items: center; padding: 16px 22px; z-index: 40; pointer-events: none; }
  .topbar > * { pointer-events: auto; }
  .brand { display: flex; gap: 10px; align-items: center; }
  .logo { width: 34px; height: 34px; border-radius: 11px; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
  .brand b { display: block; font-size: 15px; }
  .brand small { color: var(--muted); font-size: 12px; font-weight: 650; }
  .daychip { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; padding: 8px 16px; border-radius: 999px; background: rgba(255, 252, 249, .55); backdrop-filter: blur(10px); font-size: 14px; font-weight: 750; box-shadow: var(--shadow-sm); border: 1px solid rgba(255, 255, 255, .7); }
  .daychip em { font-style: normal; font-size: 18px; }
  .daychip span { transition: opacity .4s; }
  .tr { display: flex; gap: 10px; align-items: center; }

  .marker { position: fixed; left: 0; top: 0; z-index: 20; transform: translate(-50%, -100%); display: grid; justify-items: center; pointer-events: none; transition: opacity .35s; }
  .marker.gone { opacity: 0; }
  .marker .pill { pointer-events: auto; border: 0; display: flex; gap: 8px; align-items: center; padding: 12px 20px 12px 14px; border-radius: 999px; background: rgba(255, 252, 249, .8); backdrop-filter: blur(10px); box-shadow: var(--shadow); font-size: 15px; font-weight: 750; color: var(--ink); animation: float 3s ease-in-out infinite; }
  .marker .pill i { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; }
  .marker.compact .pill { padding: 8px; font-size: 0; gap: 0; }
  .marker.compact .stem { height: 30px; }
  .marker .stem { width: 2px; height: 46px; background: linear-gradient(rgba(214, 120, 77, .7), rgba(214, 120, 77, 0)); }
  .marker .dot { width: 14px; height: 6px; border-radius: 50%; background: rgba(214, 120, 77, .6); box-shadow: 0 0 0 6px rgba(214, 120, 77, .15); }
  @keyframes float { 50% { transform: translateY(-6px); } }

  .acard { position: fixed; left: 0; top: 0; z-index: 30; width: 380px; max-width: calc(100vw - 24px); transform: translate(-50%, calc(-100% - 22px)) scale(.2); transform-origin: 50% 100%; opacity: 0; pointer-events: none; transition: transform .55s cubic-bezier(.22, 1.25, .36, 1), opacity .3s; }
  .acard.open { transform: translate(-50%, calc(-100% - 22px)) scale(1); opacity: 1; pointer-events: auto; }
  .acard .in { background: rgba(255, 251, 247, .94); backdrop-filter: blur(16px); border-radius: 26px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 14px; border: 1px solid rgba(255, 255, 255, .8); max-height: calc(100vh - 140px); overflow: auto; }
  .acard .in::after { content: ""; }
  .acard .tail { position: absolute; left: 50%; bottom: -9px; width: 18px; height: 18px; background: rgba(255, 251, 247, .94); transform: translateX(-50%) rotate(45deg); border-radius: 4px; }
  .ahead { display: flex; justify-content: space-between; align-items: center; }
  .ahead b { font-size: 15px; }
  .x { border: 0; background: var(--paper-3); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); flex: none; }

  .polaroid { position: relative; background: #fff; padding: 10px 10px 34px; border-radius: 6px; box-shadow: 0 14px 30px -16px rgba(80, 40, 20, .55); transform: rotate(-2.5deg); width: 200px; justify-self: center; }
  .polaroid .ph { aspect-ratio: 4 / 3; border-radius: 3px; overflow: hidden; background: repeating-linear-gradient(45deg, #f6eee8 0 10px, #f1e6de 10px 20px); display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 13px; font-weight: 700; cursor: pointer; border: 2px dashed rgba(58, 46, 40, .2); }
  .polaroid .ph.has { border: 0; cursor: default; }
  .polaroid .ph input { display: none; }
  .polaroid .cap { position: absolute; left: 0; right: 0; bottom: 7px; text-align: center; font-size: 15px; color: var(--ink-2); }
  .tries { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .tries button { border: 1px solid var(--line-2); background: #fff; border-radius: 999px; padding: 3px 10px 3px 3px; font-size: 12px; font-weight: 700; display: flex; gap: 6px; align-items: center; color: var(--ink-2); }
  .tries img { width: 26px; height: 20px; object-fit: cover; border-radius: 999px; }
  .tries button:hover { border-color: var(--accent); }

  .madlib { font-size: 17px; line-height: 2.15; font-weight: 600; color: var(--ink-2); }

/* SEAM 1 - photo classification (Claude Haiku on Amazon Bedrock).
   Production: browser uploads the photo to S3 via a presigned URL, then
   POST /api/classify {s3Key} -> Lambda -> AnthropicBedrockMantle
   messages.create({ model: 'anthropic.claude-haiku-5-5', image block +
   output_config.format json_schema { category: enum[couch,tv,coffee_table,chair],
   confidence, suggestedName } }). The enum keeps answers inside the
   supported set; the UI always lets the roommate override it. */
async function mockClassify(src = {}) {
  await sleep(1300 + Math.random() * 500);
  let guess, conf, name;
  if (src.sample) ({ guess, conf, name } = src.sample);
  else {
    const n = (src.fileName || '').toLowerCase();
    guess = /(sofa|couch|sectional|loveseat)/.test(n) ? 'couch' : /(tv|television|monitor|screen)/.test(n) ? 'tv'
      : /(coffee|table)/.test(n) ? 'coffee_table' : /(chair|stool|seat|armchair)/.test(n) ? 'chair' : null;
    conf = guess ? .91 : .64;
    guess ||= CATEGORIES[hashStr(n || String(Math.random())) % 4].id;
    name = '';
  }
  const truth = src.sample?.truth;
  const rest = CATEGORIES.filter(c => c.id !== guess).sort((a, b) => (b.id === truth) - (a.id === truth));
  let left = round2(1 - conf);
  const ranked = [{ id: guess, p: conf }];
  rest.forEach((c, i) => {
    const p = i === rest.length - 1 ? left : round2(left * (i === 0 ? .82 : .6));
    left = round2(left - p);
    ranked.push({ id: c.id, p: Math.max(0, p) });
  });
  return { category: guess, confidence: conf, ranked, suggestedName: name, model: 'anthropic.claude-haiku-5-5 (mocked)' };
}

async function fileToDataURL(file, max = 640) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', .85);
  } finally { URL.revokeObjectURL(url); }
}

      st.custom[inp.dataset.amt] = +inp.value || 0;
      const s2 = sumVals(amounts()), ok2 = p > 0 && Math.abs(s2 - p) < .01;
      sumEl.className = 'rr-split-sum ' + (ok2 ? 'ok' : 'bad');
      sumEl.textContent = ok2 ? `✓ ${money2(s2)} custom split` : `${money2(round2(p - s2))} still to assign`;
      const pctEl = inp.closest('.rr-split-row').querySelector('.pct'); pctEl.textContent = p ? Math.round((+inp.value || 0) / p * 100) + '%' : '—';
      fire();
    });
  };
  const fire = () => listeners.forEach(f => f());
  root.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    if (b.dataset.mode === 'custom' && st.mode === 'even') st.custom = amounts();
    st.mode = b.dataset.mode;
    root.querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('on', x === b));
    paint(); fire();
  });
  q('price').oninput = () => { if (st.mode === 'custom') st.custom = equalSplit(price(), [...st.among]); paint(); fire(); };
  q('name').oninput = fire;
  paint();
  return {
    onChange(fn) { listeners.add(fn); },
    setName(n) { if (!q('name').value) { q('name').value = n; fire(); } },
    read() {
      const name = q('name').value.trim(), p = price(), a = amounts();
      const splits = Object.fromEntries(Object.entries(a).filter(([, v]) => v > 0));
      if (!name) return { error: 'Give it a name' };
      if (!p) return { error: 'Add a price' };
      if (Math.abs(sumVals(splits) - p) >= .01) return { error: 'Splits need to add up to the price' };
      return { value: { name, price: p, date: q('date').value || today(), splits } };
    },
  };
}

const Ease = {

function woodTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 1024;
  const g = c.getContext('2d');
  const tones = ['#9a6c4c', '#8f6245', '#a37452', '#8a5d41', '#966a4b', '#9f7150'];
  const rows = 16, rowH = 1024 / rows;
  for (let r = 0; r < rows; r++) {
    let x = -((r * 397) % 600);
    while (x < 1024) {
      const w = 380 + ((r * 131 + x) % 260);
      g.fillStyle = tones[(r * 7 + Math.abs(Math.round(x))) % tones.length];
      g.fillRect(x, r * rowH, w, rowH);
      for (let k = 0; k < 9; k++) {
        g.strokeStyle = `rgba(80,40,15,${.05 + Math.random() * .07})`; g.lineWidth = 1 + Math.random() * 1.5;
        const y = r * rowH + 6 + Math.random() * (rowH - 12);
        g.beginPath(); g.moveTo(x, y); g.bezierCurveTo(x + w * .3, y + (Math.random() - .5) * 6, x + w * .7, y + (Math.random() - .5) * 6, x + w, y); g.stroke();
      }
      g.fillStyle = 'rgba(60,28,10,.35)'; g.fillRect(x, r * rowH, 2, rowH);
      x += w;
    }
    g.fillStyle = 'rgba(60,28,10,.32)'; g.fillRect(0, r * rowH, 1024, 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

function buildRoom({ size = 6, wallH = 3.3 } = {}) {

  const back = mesh(new THREE.BoxGeometry(size, wallH, .24), wallMat); back.position.set(0, wallH / 2, -S - .12); g.add(back);
  const capMat = M.white();
  const cap1 = mesh(new THREE.BoxGeometry(.26, .03, size + .26), capMat); cap1.position.set(-S - .12, wallH + .015, -.12); g.add(cap1);
  const cap2 = mesh(new THREE.BoxGeometry(size + .02, .03, .26), capMat); cap2.position.set(0, wallH + .015, -S - .12); g.add(cap2);
  const bbMat = M.white();

  const bb2 = mesh(new THREE.BoxGeometry(size, .14, .04), bbMat); bb2.position.set(0, .07, -S + .02); g.add(bb2);

  const win = new THREE.Group(); win.position.set(-S + .005, 0, 1.45);

  glass.rotation.y = Math.PI / 2; glass.position.set(.01, 1.75, 0); win.add(glass);
  const frameMat = M.dark();
  [[0, 2.62, 0, .05, .06, 1.6], [0, .88, 0, .05, .06, 1.6], [0, 1.75, -.78, .05, 1.8, .06], [0, 1.75, .78, .05, 1.8, .06], [0, 1.75, 0, .04, 1.74, .035]].forEach(([x, y, z, w, hh, d]) => {
    const f = mesh(new THREE.BoxGeometry(w, hh, d), frameMat); f.position.set(x + .03, y, z); win.add(f);
  });
  const rod = mesh(new THREE.CylinderGeometry(.025, .025, 2.3, 8), frameMat); rod.rotation.x = Math.PI / 2; rod.position.set(.16, 2.86, 0); win.add(rod);
  const curtMat = new THREE.MeshStandardMaterial({ color: 0xfbf8f3, roughness: 1, transparent: true, opacity: .93 });
  for (const side of [-1, 1]) for (let k = 0; k < 4; k++) {

  }
  g.add(win);

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: .16 }));

/* deterministic layout - each category has favourite spots; overflow uses the free floor */
const COFFEE = { x: .25, z: -.75 };
const faceTo = (x, z, t = COFFEE) => Math.atan2(t.x - x, t.z - z);
const SLOTS = {
  couch: [{ x: .25, z: -2.35, r: 0 }, { x: 2.15, z: .1, r: -Math.PI / 2 }],
  tv: [{ x: -2.68, z: -.75, r: Math.PI / 2 }, { x: 1.9, z: -2.7, r: 0 }],
  coffee_table: [{ x: .25, z: -.75, r: 0 }, { x: -1.2, z: 1.7, r: .3 }],
  chair: [{ x: 2.05, z: -.8 }, { x: -1.2, z: 1.3 }, { x: 1.75, z: 1.4 }, { x: .4, z: 2.1 }].map(s => ({ ...s, r: faceTo(s.x, s.z) })),
};
const OVERFLOW = [{ x: -1.6, z: 2.2 }, { x: .9, z: 2.3 }, { x: 2.3, z: 2.2 }, { x: -2.2, z: -2.2 }, { x: 2.3, z: -2.3 }].map(s => ({ ...s, r: faceTo(s.x, s.z) }));
function pickSlot(cat, items) {
  const taken = new Set(items.map(i => i.slotKey));
  const list = (SLOTS[cat] || []).map((s, i) => ({ ...s, key: cat + i })).concat(OVERFLOW.map((s, i) => ({ ...s, key: 'o' + i })));
  return list.find(s => !taken.has(s.key)) || { x: (Math.random() - .5) * 3, z: (Math.random() - .5) * 3, r: 0, key: uid('free') };
}

function setGlow(obj, amt, color = 0xff9a5c) {
  obj.traverse(o => { if (o.isMesh && o.material?.emissive && !o.userData.keepEmissive) { o.material.emissive.set(color); o.material.emissiveIntensity = amt; } });
}
function setOpacity(obj, a) {
  obj.traverse(o => { if (o.isMesh) { o.material.transparent = a < 1; o.material.opacity = a; o.material.depthWrite = a > .5; } });
}
function itemRootOf(obj) { while (obj && !obj.userData.itemId) obj = obj.parent; return obj; }
function puff(scene, at, color = 0xffffff, n = 14) {
  const geo = new THREE.SphereGeometry(.08, 8, 6);
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, roughness: 1, transparent: true }));
    const a = (i / n) * Math.PI * 2, sp = .8 + Math.random() * .8;
    m.position.copy(at); scene.add(m);
    tween(700 + Math.random() * 300, k => {
      m.position.set(at.x + Math.cos(a) * sp * k, at.y + .2 + k * .6 + Math.sin(k * 3) * .1, at.z + Math.sin(a) * sp * k);
      m.scale.setScalar(1 + k * 1.6); m.material.opacity = 1 - k;
    }, Ease.out).then(() => { scene.remove(m); m.material.dispose(); });
  }
}
function projectToScreen(v3, camera, rect) {
  const p = v3.clone().project(camera);
  return { x: rect.left + (p.x + 1) / 2 * rect.width, y: rect.top + (1 - p.y) / 2 * rect.height, behind: p.z > 1 };
}

  const pw = $('#glassL').offsetWidth + 20;

  const worldPerPx = 2 * goal.dist * Math.tan(THREE.MathUtils.degToRad(cam.fov / 2)) / innerHeight;
  goal.pan = -(L - R) / 2 * worldPerPx;
  goal.distMul = panels.L && panels.R ? 1.28 : 1;

function applyRig(dt) {
  const k = 1 - Math.exp(-dt * 2.6);
  for (const key of ['az', 'pol', 'dist', 'tx', 'ty', 'tz', 'pan']) rig[key] += (goal[key] - rig[key]) * k;
  rig.distMul = (rig.distMul ?? 1) + ((goal.distMul ?? 1) - (rig.distMul ?? 1)) * k;
  if (spin) goal.az = Math.PI / 4 + Math.sin(performance.now() / 2600) * .38;
  const d = rig.dist * rig.distMul, rx = Math.cos(rig.az), rz = -Math.sin(rig.az);
  const t = new THREE.Vector3(rig.tx + rx * rig.pan, rig.ty, rig.tz + rz * rig.pan);

    inp.onchange = async () => { const f = inp.files[0]; if (f) { D.photo = await fileToDataURL(f); D.fileName = f.name; classify(); } };
    el.querySelectorAll('.tries button').forEach(b => b.onclick = () => { const s = SAMPLES.find(x => x.key === b.dataset.k); D.photo = samplePhoto(s.draw); D.sample = s; D.fileName = s.file; classify(); });
  } else {
    const r = D.result, low = r && r.confidence < .7 && D.cat === r.category;
    const v = D.sample || {};
    el.innerHTML = `<div class="ahead"><b>${r ? 'Tell us about it' : 'Taking a look…'}</b><button class="x" data-x>${icon('close', 13)}</button></div>
      <div class="polaroid"><div class="ph has rr-scan ${r ? '' : 'on'}"><img src="${D.photo}" alt="Uploaded photo"></div><div class="cap hand">${r ? esc(v.name || CAT[D.cat].label) : 'Claude Haiku is looking…'}</div></div>
      ${r ? `<div class="madlib">This is our <select class="tok ${low ? 'warn' : ''}" id="tCat">${CATEGORIES.map(c => `<option value="${c.id}" ${c.id === D.cat ? 'selected' : ''}>${catWord(c.id)}</option>`).join('')}</select><span class="conf ${low ? 'warn' : ''}">${D.cat === r.category ? Math.round(r.confidence * 100) + '%' + (low ? ' · check me' : '') : '✓ you'}</span>,
        we call it <input class="tok" id="tName" value="${esc(v.name || '')}" placeholder="a name">.
        We paid <span style="white-space:nowrap">$<input class="tok num" id="tPrice" type="number" min="0" step="0.01" value="${v.price ?? ''}" placeholder="0"></span>
        on <input class="tok date" id="tDate" type="date" value="${v.date || today()}">
        and split it <select class="tok" id="tMode"><option value="even">evenly</option><option value="custom">our own way</option></select>
        between <span class="whochips" id="tWho">${ROOMMATES.map(rm => `<button type="button" data-w="${rm.id}" class="${D.among.has(rm.id) ? '' : 'off'}" title="${rm.name}">${av(rm.id, 30)}</button>`).join('')}</span>.</div>
        <div class="custom rr-hidden" id="tCustom"></div><div class="sumline" id="tSum"></div>
        <button class="rr-btn block" id="tPut">${icon('spark', 16)}Put it in the room</button>` : `<div class="rr-thinking" style="justify-self:center"><span class="rr-dots"><i></i><i></i><i></i></span>Classifying (mocked Bedrock call)</div>`}`;
    if (r) wireMadlib();
  }
  el.querySelector('[data-x]').onclick = closeAdd;
}
async function classify() {
  paintAdd();
  const tok = ++D.tok;
  const r = await mockClassify({ sample: D.sample, fileName: D.fileName });
  if (tok !== D.tok || !addOpen) return;
  D.result = r; D.cat = r.category; paintAdd();
}
function madAmounts() {
  const p = Math.max(0, +$('#tPrice').value || 0), ids = [...D.among];
  if (D.mode === 'even') return ids.length ? equalSplit(p, ids) : {};
  return Object.fromEntries(ids.map(id => [id, +D.custom[id] || 0]));
}
function paintSum() {
  const p = Math.max(0, +$('#tPrice').value || 0), a = madAmounts(), s = sumVals(a), ok = p > 0 && Math.abs(s - p) < .01;
  const el = $('#tSum'); el.className = 'sumline ' + (ok ? 'ok' : 'bad');
  el.textContent = !p ? 'Add what you paid' : ok ? `✓ ${D.among.size === 1 ? 'one person' : D.among.size + ' people'} · ${Object.entries(a).map(([id, v]) => `${RM[id].name} ${money2(v)}`).join(' · ')}` : `${money2(round2(p - s))} still to assign`;
}
function paintCustom() {
  const c = $('#tCustom');
  c.classList.toggle('rr-hidden', D.mode !== 'custom');
  if (D.mode !== 'custom') return;
  c.innerHTML = [...D.among].map(id => `<label>${av(id, 24)}${RM[id].name}<span class="rr-money"><b>$</b><input class="rr-input" type="number" step="0.01" data-c="${id}" value="${D.custom[id] ?? ''}"></span></label>`).join('');
  c.querySelectorAll('[data-c]').forEach(i => i.oninput = () => { D.custom[i.dataset.c] = +i.value || 0; paintSum(); });
}
function wireMadlib() {
  $('#tCat').onchange = e => { D.cat = e.target.value; paintAdd(); };
  $('#tMode').value = D.mode;
  $('#tMode').onchange = e => { D.mode = e.target.value; if (D.mode === 'custom') D.custom = equalSplit(Math.max(0, +$('#tPrice').value || 0), [...D.among]); paintCustom(); paintSum(); };
  $('#tPrice').oninput = () => { if (D.mode === 'custom') { D.custom = equalSplit(Math.max(0, +$('#tPrice').value || 0), [...D.among]); paintCustom(); } paintSum(); };
  document.querySelectorAll('#tWho [data-w]').forEach(b => b.onclick = () => {
    const id = b.dataset.w; D.among.has(id) ? D.among.delete(id) : D.among.add(id);
    b.classList.toggle('off', !D.among.has(id)); paintCustom(); paintSum();
  });
  $('#tPut').onclick = putInRoom;
  paintCustom(); paintSum();
}
function putInRoom() {
  const name = $('#tName').value.trim(), price = Math.max(0, +$('#tPrice').value || 0);
  const splits = Object.fromEntries(Object.entries(madAmounts()).filter(([, v]) => v > 0));
  if (!name) return toast('Give it a name');
  if (!price) return toast('Add what you paid');
  if (Math.abs(sumVals(splits) - price) >= .01) return toast('Splits need to add up to the price');
  const slot = house.items.length ? pickSlot(D.cat, house.items) : pickSlot(D.cat, house.items);
  const item = { id: uid('it'), name, price, date: $('#tDate').value || today(), splits, category: D.cat, photo: D.photo, slotKey: slot.key };
  addOpen = false; $('#acard').classList.remove('open');
  materialize(item, slot);
  toast(`${icon('spark', 16)} ${esc(name)} is in the room`);
  setShot(phase === 'movein' ? 'movein' : 'living'); panGoal();
}
function materialize(item, slot) {
  house.items.push(item);
  const m = buildModel(item.category); m.userData.itemId = item.id;
  m.position.set(slot.x, 0, slot.z); m.rotation.y = slot.r - .6; m.scale.set(.01, .01, .01);
  itemsGroup.add(m); objs.set(item.id, m);
  const ring = new THREE.Mesh(new THREE.RingGeometry(.2, .32, 48), new THREE.MeshBasicMaterial({ color: 0xffb489, transparent: true, depthWrite: false }));
  ring.rotation.x = -Math.PI / 2; ring.position.set(slot.x, .04, slot.z); itemsGroup.add(ring);
  tween(900, k => { ring.scale.setScalar(1 + k * 7); ring.material.opacity = 1 - k; }, Ease.out).then(() => itemsGroup.remove(ring));
  tween(1100, k => { const s = Math.max(.01, Ease.outBack(k)); m.scale.set(s, s, s); m.rotation.y = slot.r - .6 * (1 - Ease.out(k)); m.position.y = Math.sin(k * Math.PI) * .5; }, Ease.linear);
  setTimeout(() => puff(itemsGroup, new THREE.Vector3(slot.x, .4, slot.z), 0xffd9bd, 12), 250);
  house.changed(); computeNextSlot(); refresh();
}
$('#addPill').onclick = openAdd;
$('#doneBtn').onclick = () => { setPhase('living'); toast(`${icon('check', 16)} Moved in. Roomie and Bills are on either side`); };

/* ---------------- picking, focus, move-out ---------------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let hovered = null, focusId = null, keeper = null, buyValue = 0, dragEl = null;
function hit(e) {
  ndc.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); ray.setFromCamera(ndc, cam);
  const h2 = ray.intersectObjects([...objs.values()], true)[0]; return h2 ? itemRootOf(h2.object) : null;
}
canvas.addEventListener('pointermove', e => {
  if (phase === 'login' || addOpen || phase === 'ended') return;
  const o = hit(e);
  if (o !== hovered) { if (hovered && hovered.userData.itemId !== focusId) setGlow(hovered, 0); hovered = o; if (o && o.userData.itemId !== focusId) setGlow(o, .14); }
  document.body.classList.toggle('hovering', !!o);
});
canvas.addEventListener('click', e => {
  if (phase === 'login' || addOpen || phase === 'ended') return;
  const o = hit(e);
  if (o) focusItem(o.userData.itemId); else if (focusId) unfocus();
});
addEventListener('keydown', e => { if (e.key === 'Escape') { if (addOpen) closeAdd(); else if (focusId) unfocus(); } });

const pedestal = new THREE.Mesh(new THREE.RingGeometry(.9, 1.05, 64), new THREE.MeshBasicMaterial({ color: 0xffa36e, transparent: true, opacity: 0, depthWrite: false }));
pedestal.rotation.x = -Math.PI / 2; pedestal.position.y = .03; itemsGroup.add(pedestal);
function focusItem(id) {
  if (focusId) unfocus(true);
  const item = house.items.find(i => i.id === id), o = objs.get(id); if (!item) return;
  focusId = id; keeper = null; buyValue = item.price;
  setGlow(o, .18);
  const s = o.userData.size; pedestal.scale.setScalar(Math.max(s.w, s.d) * .5); pedestal.position.x = o.position.x; pedestal.position.z = o.position.z;
  tween(400, k => { o.position.y = k * .3; pedestal.material.opacity = k * .8; }, Ease.outBack);
  o.userData.baseRot = o.rotation.y;
  setShot(phase === 'moveout' ? 'moveout' : 'living', { tx: o.position.x, ty: .9, tz: o.position.z, dist: 14 }); panGoal();
  paintItemCard(item); $('#icard').classList.add('open'); refresh();
}
function unfocus(quick) {
  const o = objs.get(focusId);
  if (o) { setGlow(o, 0); const y0 = o.position.y, r0 = o.rotation.y, rb = o.userData.baseRot ?? r0; tween(quick ? 150 : 350, k => { o.position.y = y0 * (1 - k); o.rotation.y = lerp(r0, rb, k); pedestal.material.opacity = .8 * (1 - k); }); }
  focusId = null; $('#icard').classList.remove('open'); $('#bubbles').classList.remove('show'); $('#draghint').classList.remove('show');
  if (!quick) { setShot(phase === 'moveout' ? 'moveout' : phase === 'movein' ? 'movein' : 'living'); panGoal(); }
  refresh();
}
function paintItemCard(item, step = 1) {
  const el = $('#icardIn');
  const rows = Object.entries(item.splits).map(([rid, v]) => `<div><span>${RM[rid].name} chipped in</span><span>${money2(v)}</span></div>`).join('');
  const t = keeper ? buyout(item, keeper, buyValue) : [];
  el.innerHTML = `<div class="ahead"><b>${esc(item.name)}</b><button class="x" data-x>${icon('close', 13)}</button></div>
    <div class="polaroid" id="dragPhoto" title="${step === 2 ? 'Drag me to a roommate' : ''}"><img src="${item.photo}" alt=""><div class="cap hand">${catWord(item.category)} · ${fmtDate(item.date)}</div></div>
    ${step === 1 ? `<div class="receipt">${rows}<div class="tot"><span>TOTAL</span><span>${money2(item.price)}</span></div></div>
      <button class="rr-btn dark block" id="moBtn">${icon('box', 16)}Move it out</button>`
    : `${keeper ? `<div class="receipt"><div><b>${RM[keeper].name} keeps it</b><span>at ${money2(buyValue)}</span></div>${t.length ? t.map(x => `<div><span>${RM[x.from].name} → ${RM[x.to].name}</span><span>${money2(x.amount)}</span></div>`).join('') : '<div><span>No buyout needed</span><span>$0</span></div>'}</div>
        <div class="ask" id="ask"><div>Is ${money(item.price)} still fair?</div><div class="row"><button class="rr-btn soft sm" id="askBtn">${icon('spark', 14)}Ask Roomie for a fair price</button></div></div>
        <button class="rr-btn block" id="handBtn">${icon('key', 16)}Hand it over</button>`
      : `<div class="rr-empty-note">Who's keeping it? Drag the photo onto a roommate below, or tap one.</div>`}`}`;
  el.querySelector('[data-x]').onclick = () => unfocus();
  if (step === 1) $('#moBtn').onclick = () => startMoveOut(item);
  else {
    wireDrag(item);
    if (keeper) { $('#askBtn').onclick = () => askFair(item); $('#handBtn').onclick = () => handOver(item); }
  }
}
function startMoveOut(item) {
  if (phase === 'living') setPhase('moveout');
  setShot('moveout', { tx: objs.get(item.id).position.x, ty: .9, tz: objs.get(item.id).position.z, dist: 14 }); panGoal();
  $('#bubbles').innerHTML = ROOMMATES.map(r => `<button class="bubble" data-b="${r.id}" style="--c:${r.color}"><span class="init">${r.name[0]}</span>${r.name}<small>${item.splits[r.id] ? 'owns ' + Math.round(item.splits[r.id] / item.price * 100) + '%' : 'not an owner'}</small>${(house.keptBy[r.id] || []).length ? `<span class="count">${house.keptBy[r.id].length}</span>` : ''}</button>`).join('');
  $('#bubbles').classList.add('show'); $('#draghint').classList.add('show');
  document.querySelectorAll('.bubble').forEach(b => b.onclick = () => pickKeeper(item, b.dataset.b));
  paintItemCard(item, 2);
}
function pickKeeper(item, rid) {
  keeper = rid; $('#draghint').classList.remove('show');
  document.querySelectorAll('.bubble').forEach(b => b.classList.toggle('on', b.dataset.b === rid));
  paintItemCard(item, 2);
}
function wireDrag(item) {
  const ph = $('#dragPhoto');
  ph.onpointerdown = e => {
    e.preventDefault();
    dragEl = h(`<div class="dragghost"><img src="${item.photo}" alt=""></div>`); document.body.append(dragEl);
    const move = ev => {
      dragEl.style.left = ev.clientX + 'px'; dragEl.style.top = ev.clientY + 'px';
      document.querySelectorAll('.bubble').forEach(b => { const r = b.getBoundingClientRect(); b.classList.toggle('hot', ev.clientX > r.left && ev.clientX < r.right && ev.clientY > r.top && ev.clientY < r.bottom); });
    };
    const up = () => {
      removeEventListener('pointermove', move); removeEventListener('pointerup', up);
      const hot = document.querySelector('.bubble.hot'); document.querySelectorAll('.bubble').forEach(b => b.classList.remove('hot'));
      dragEl.remove(); dragEl = null;
      if (hot) pickKeeper(item, hot.dataset.b);
    };
    move(e); addEventListener('pointermove', move); addEventListener('pointerup', up);
  };
}
async function askFair(item) {
  const box = $('#ask');
  box.innerHTML = `<span class="rr-thinking"><span class="rr-dots"><i></i><i></i><i></i></span>Roomie is thinking (mocked Sonnet)</span>`;
  await sleep(900);
  const sug = suggestedValue(item, .2), months = Math.max(1, Math.round(sug.years * 12));
  const txt = `It's about ${months} month${months === 1 ? '' : 's'} old. Used furniture usually loses around 20% a year, so a fair buyout is **${money(sug.value)}** instead of ${money(item.price)}.`;
  box.innerHTML = '<div id="askTxt"></div>';
  await streamText($('#askTxt'), txt);
  box.insertAdjacentHTML('beforeend', `<div class="row"><button class="rr-btn sm" id="useSug">Use ${money(sug.value)}</button><button class="rr-btn ghost sm" id="keepFull">Keep ${money(item.price)}</button></div>`);
  $('#useSug').onclick = () => { buyValue = sug.value; paintItemCard(item, 2); };
  $('#keepFull').onclick = () => { buyValue = item.price; paintItemCard(item, 2); };
}
async function handOver(item) {
  const o = objs.get(item.id), rid = keeper, value = buyValue;
  const b = document.querySelector(`.bubble[data-b="${rid}"]`).getBoundingClientRect();
  $('#icard').classList.remove('open'); $('#draghint').classList.remove('show');
  setGlow(o, 0); pedestal.material.opacity = 0;
  const t = confirmMoveOut(item, rid, value);
  focusId = null;
  const start = o.getWorldPosition(new THREE.Vector3());
  const ndcZ = start.clone().project(cam).z;
  const end = new THREE.Vector3((b.left + b.width / 2) / innerWidth * 2 - 1, -((b.top + b.height / 2) / innerHeight) * 2 + 1, ndcZ).unproject(cam);
  const mid = start.clone().lerp(end, .5); mid.y += 2.2;
  const inv = new THREE.Matrix4().copy(itemsGroup.matrixWorld).invert();
  const s0 = o.scale.x;
  await tween(900, k => {
    const p = new THREE.Vector3().copy(start).multiplyScalar((1 - k) * (1 - k)).addScaledVector(mid, 2 * (1 - k) * k).addScaledVector(end, k * k).applyMatrix4(inv);
    o.position.copy(p); o.rotation.y += .08; o.scale.setScalar(Math.max(.01, s0 * (1 - k * .92)));
  }, Ease.inOut);
  itemsGroup.remove(o); objs.delete(item.id); pedestal.material.opacity = 0;
  const bub = document.querySelector(`.bubble[data-b="${rid}"]`);
  bub.classList.remove('gulp'); void bub.offsetWidth; bub.classList.add('gulp');
  bub.querySelector('.count')?.remove(); bub.insertAdjacentHTML('beforeend', `<span class="count">${house.keptBy[rid].length}</span>`);
  toast(`${icon('key', 16)} ${RM[rid].name} keeps the ${esc(item.name)}${t.length ? ' · ' + t.map(x => `${money2(x.amount)} to ${RM[x.to].name}`).join(', ') : ''}`, 3600);
  await sleep(900);
  $('#bubbles').classList.remove('show');
  if (!house.items.length) { setTimeout(showFinal, 400); return; }
  setShot('moveout'); panGoal(); refresh();
}
function showFinal() {
  setPhase('ended');
  const net = settleUp(netsFrom([], house.buyouts));
  $('#final').innerHTML = `<div style="font-size:38px">🌙</div><h2>Everyone's square</h2>
    <p class="rr-muted">The room is empty and every shared thing went home with someone.</p>
    <div class="people">${ROOMMATES.map(r => `<div class="person">${av(r.id, 40)}<b>${r.name}</b><span class="its">${(house.keptBy[r.id] || []).map(i => `<span title="${esc(i.name)}">${icon(i.category, 18)}</span>`).join('') || '<span class="rr-muted">nothing</span>'}</span></div>`).join('')}</div>
    <div class="rows">${net.length ? net.map(x => `<div>${av(x.from, 26)}<span style="flex:1">${RM[x.from].name} pays ${RM[x.to].name}</span><b>${money2(x.amount)}</b></div>`).join('') : '<div>No buyouts owed.</div>'}</div>
    <button class="rr-btn" onclick="location.reload()">Find a new place</button>`;
  $('#final').classList.add('open');
  ROOMMATES.forEach((r, i) => setTimeout(() => puff(scene, new THREE.Vector3(0, 1.5, 0), new THREE.Color(r.color).getHex(), 18), i * 250));
}

/* ---------------- shortcuts, login, loop ---------------- */
$('#archBtn').onclick = () => openArch({
  title: "Option C · How it's built", sub: 'Cinematic camera choreography, in-world anchored cards, drag-to-person move-out, lighting that follows the phase.',
  bullets: ['<b>Camera</b>: a scripted rig (azimuth, polar, distance, target) eases between named shots: a low frontal "move-in" shot, the iso "living" shot, a golden-hour "move-out" shot and a pull-back finale. Phases feel like scenes rather than screens.',
    '<b>Room shift</b>: floating glass panels pop out of round buttons; the camera trucks sideways in world space (the target and position move along the camera\'s right vector), so the room slides with real parallax. With both panels open it also dollies back.',
    '<b>Add</b>: the Add marker floats over the most open patch of floor. Its card is a fill-in-the-blanks sentence instead of a form; the item then grows into its spot with a pulse of light.',
    '<b>Move-out</b>: drag the item\'s polaroid onto a roommate bubble (or tap one). An optional "Ask Roomie for a fair price" reuses the Sonnet chat seam to suggest a depreciated buyout.', ...ARCH_COMMON],
});
function quickFill() {
  SAMPLES.forEach((s, i) => setTimeout(() => { const slot = pickSlot(s.truth, house.items); materialize({ id: uid('it'), name: s.name, price: s.price, date: s.date, category: s.truth, photo: samplePhoto(s.draw), splits: equalSplit(s.price), slotKey: slot.key }, slot); }, i * 280));
}
$('#fillBtn').onclick = () => { if (phase === 'login' || phase === 'ended') return; if (addOpen) closeAdd(); quickFill(); };
$('#skipBtn').onclick = () => { if (phase !== 'movein') return; if (addOpen) closeAdd(); if (!house.items.length) quickFill(); setTimeout(() => setPhase('living'), 1300); };
$('#resetBtn').onclick = () => location.reload();
$('#loginForm').onsubmit = e => { e.preventDefault(); $('#login').classList.add('gone'); setPhase('movein'); };
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); panGoal(); });
window.__rr = { house, focusItem, startMoveOut, pickKeeper, handOver, setPhase, objs };

renderer.setSize(innerWidth, innerHeight);
computeNextSlot();
const tmp = new THREE.Vector3();
let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  tickTweens(now);
  if (phase === 'living' && !focusId && !panels.L && !panels.R) goal.az = SHOTS.living.az + Math.sin(now / 5200) * .05;
  applyRig(dt);
  if (focusId) { const o = objs.get(focusId); if (o) o.rotation.y += dt * .5; }
  const rect = { left: 0, top: 0, width: innerWidth, height: innerHeight };
  const mk = projectToScreen(tmp.set(nextSlot.x, .05, nextSlot.z), cam, rect);
  Object.assign($('#marker').style, { left: mk.x + 'px', top: mk.y + 'px' });
  const ac = $('#acard'), aw = Math.min(380, innerWidth - 24), ah = ac.offsetHeight;
  Object.assign(ac.style, { left: Math.min(innerWidth - aw / 2 - 12, Math.max(aw / 2 + 12, mk.x)) + 'px', top: Math.max(ah + 96, mk.y) + 'px' });
  if (focusId) {
    const o = objs.get(focusId);
    if (o) {
      const p = projectToScreen(o.getWorldPosition(tmp).add(new THREE.Vector3(0, .8, 0)), cam, rect);
      const ic = $('#icard'), flip = p.x > innerWidth * .58;
      ic.classList.toggle('flip', flip);
      const off = Math.max(120, (o.userData.size?.w || 1) * 62);
      Object.assign(ic.style, { left: (flip ? p.x - off : p.x + off) + 'px', top: Math.min(innerHeight - ic.offsetHeight / 2 - 150, Math.max(ic.offsetHeight / 2 + 80, p.y)) + 'px' });
    }
  }
  if (hovered && !focusId) {
    const p = projectToScreen(hovered.getWorldPosition(tmp).add(new THREE.Vector3(0, (hovered.userData.size?.h || 1) + .3, 0)), cam, rect);
    const it = house.items.find(i => i.id === hovered.userData.itemId);
    Object.assign($('#tag').style, { left: p.x + 'px', top: p.y + 'px' }); $('#tag').textContent = it ? `${it.name} · ${money(it.price)}` : ''; $('#tag').classList.toggle('on', !!it);
  } else $('#tag').classList.remove('on');
  renderer.render(scene, cam);
});
